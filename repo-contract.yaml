# repo-contract.yaml — Machine-readable contract for itera-player
# Defines provided interfaces, consumed dependencies, environment,
# health checks, and agent integration metadata.
#
# 2026-07-28: reescrito. Este arquivo descrevia o engine gamificado LEGADO
# (FixTheCode/BreakAndFix/… + src/pages/LessonPage.tsx), herdado do scaffold de  # verify-docs:allow-missing
# dfl-iterate no commit de fundação deste repo. Aquele engine foi aposentado
# (ADR-12 do plano 20260728-itera-activity-testing) e os paths não existem
# mais. Ver CLAUDE.md para o engine canônico.

name: itera-player
description: >
  Itera player — app de aluno/instrutor da Itera (app.iterahq.dev). Roda
  lições e activities vindas do Supabase da Itera, com aula ao vivo,
  superfície de autoria e back-office admin.

type: platform
version: 1.0.0

owner:
  team: itera
  github: "@taigfs @SamuelStefano"

stack:
  runtime: browser
  framework: react-18
  bundler: vite-8
  language: typescript-5
  styling: tailwind-css
  ui_library: shadcn-ui + "@devfellowship/components"
  editor: monaco-editor
  animations: framer-motion
  state: tanstack-react-query
  data: supabase
  testing: vitest + playwright
  observability: opentelemetry

provides:
  - type: database
    name: learning-source-ingest-preservation
    description: >
      Exact nullable original batch UUID with strict paired-value coexistence.
      Caller-only typed episode column metadata and immutable A2 hash projection.
    entry: db/migrations/0098_learning_source_ingest_preservation.sql

  - type: database
    name: learning-evidence-metadata-expand
    description: >
      Additive generated evidence metadata with exact key-presence reconstruction and strict lossless audit.
      Original JSON, existing writers, receipts and source relationships remain intact.
    entry: db/migrations/0093_learning_evidence_metadata_expand.sql

  - type: database
    name: historical-digest-extraction
    description: Caller-scoped atomic digest passes with a fixed reviewed T14 release boundary.
    entry: db/migrations/0090_learning_digest_extraction.sql

  - type: database
    name: learning-residue-repass
    description: >
      Caller-JWT atomic residue-only evidence writes with immutable matched/unmatched receipts.
      Editorial decisions stay unchanged and state refresh is a separate operation.
    entry: db/migrations/0091_learning_residue_repass.sql

  - type: database
    name: historical-session-regroup
    description: >
      Frozen pre-cutoff turns become linked sessions without deleting evidence.
      Project, context and thirty-minute gap boundaries preserve capture provenance.
      Explicit ADR-24 historical data migration; later captures remain outside its manifest.
    entry: db/migrations/0088_learning_session_regroup.sql

  - type: database
    name: learning-artifact-cleanup
    description: >
      Caller-JWT deletion of an owned artifact with no evidence references.
      SECURITY INVOKER and READ COMMITTED; learner lock precedes artifact row lock.
    entry: db/migrations/0086_learning_artifact_cleanup.sql


  - type: database
    name: learning-extraction-pass-rpc
    description: >
      Atomic caller-JWT evidence or residue passes through learning.record_extraction_pass(jsonb).
      SECURITY INVOKER, current vocabulary validation, and immutable learning.extraction_passes retry receipts.
    entry: db/migrations/0085_learning_extraction_pass_atomic.sql
  - type: database
    name: learning-authorization-probe
    description: >-
      Caller-JWT SECURITY INVOKER diagnostic for a shared capability INSERT.
      Strict resource/operation/reference input; every attempted write rolls back.
      Separates RLS denial, missing privileges, constraint failures, and unexpected permission.
    entry: db/migrations/0092_learning_authorization_probe.sql
  - type: database
    name: learning-dml-rpc
    description: >
      Atomic caller-JWT learning mutations through learning.apply_dml(text,jsonb).
      SECURITY INVOKER; editorial writes require a learning operator.
      Proposal decisions are atomic, proposal-bound, and write zero evidence.
      The migration requires all CI green under the ITERA PR467+ authorization.
    entry: db/migrations/0087_learning_proposal_decisions.sql

  - type: database
    name: learning-capability-graph-transition
    description: >
      Additive typed capability endpoints for shared relations and owner claim links.
      Caller-JWT SECURITY INVOKER functions require complete original row preimages.
      Targets derive only through locked capabilities.concept_id pointers.
      The atomic relation import preserves authenticated shared-edge access and stable row IDs.
    entry: db/migrations/0100_learning_capability_graph_endpoints.sql

  - type: database
    name: mcp-tool-call-usage-log
    description: >
      Append-only usage log with one row per itera-mcp tool call.
      The MCP server inserts each row with the caller's user-JWT, never service_role.
      RLS allows an insert only for the caller's own user_id.
      A user reads own rows. The platform operator reads all rows.
    entry: db/migrations/0101_mcp_tool_calls.sql

  - type: database
    name: catalog-program-outline
    description: >
      Read-only syllabus of one live self-serve catalog program, by slug.
      Unit and lesson titles plus published activity counts; no activity content, no tenant id.
      Zero rows for a non-catalog, archived or unknown slug. EXECUTE to authenticated only.
    entry: db/migrations/0102_catalog_program_outline.sql

  - type: database
    name: learning-delivery-products
    description: >
      Learner-owned deliveries and artifacts, with shared or owned task models.
      Nullable claim and evidence links preserve existing measurements.
      The autonomy target is optional authored text without an invented scale.
    entry: db/migrations/0084_learning_valued_work_artifacts.sql

  - type: database
    name: learning-v2-capture
    description: >
      Atomic caller-JWT session capture through learning.ingest_episode_v2(jsonb,text,text).
      SECURITY INVOKER, explicit-root owned context, ordered captured moments, and exact retry receipts.
      V1 capture remains supported; this schema does not publish a client.
    entry: db/migrations/0089_learning_v2_episode_ingest.sql

  - type: ui
    name: lesson-player
    description: >
      Player canônico da lição — percorre a sequência de activities de uma
      lição, grava progresso e artifacts no Supabase da Itera.
    entry: src/pages/LessonPlayer.tsx

  - type: ui
    name: activity-engine
    description: >
      Engine canônico de activity. O ActivityRenderer despacha uma linha de
      itera.activities para a view do seu `kind`. A lista dos kinds vive UMA vez
      neste arquivo, na chave `activity_kinds` lá embaixo — não a repita aqui.
      Ela é verificada contra db/migrations/*.sql por
      scripts/verify-activity-kinds.mjs. O app renderiza 13 dos 14:
      sandbox_scenario segue no enum do banco, sem linha nenhuma, e sem
      renderer desde activity-spec 1.0.0.
      Lógica derivada de resposta/correção vive na máquina pura
      src/utils/answerMachine.ts; o gate do ao-vivo em
      src/utils/liveActivityGate.ts.
      Fase C (2026-08-07): as dez kinds sem backend (concept, concept_reveal,
      video, single_choice, multi_choice, match, order — passos 1-3 —,
      chat_sandbox e terminal_sandbox, com as pastas sandbox/ e terminal/
      inteiras, passo 4, e code, passo 5), os primitivos e a lógica pura foram
      extraídos para
      @iterahq/activities em packages/activities/; os caminhos antigos em src/
      viraram re-export de uma linha e src/utils/answerMachine.ts é um desses.
      Editar o pacote, não o shim. O code sai por um SEGUNDO entrypoint
      (@iterahq/activities/code, ADR-5) e não está em BUILT_IN_ACTIVITY_KINDS:
      o host o registra em ActivityHostContext.renderers. O Monaco fica no app
      (src/components/editor/CodeEditor.tsx) e é injetado pela porta codeEditor,
      e o rascunho passa pela porta storage. Ficaram no app: sandbox-live/,
      byoc/, JudgeHeatmap e os kinds inline no dispatcher.
    entry: src/components/branded/activity/

  - type: ui
    name: live-class
    description: >
      Aula ao vivo — stage do instrutor, timer/gate, roster ranqueado, podium
      e a sessão do lado do aluno.
    entry: src/pages/live/

  - type: ui
    name: authoring
    description: >
      Superfície de autoria + harness isolado de activity
      (/author/activities/:activityId/test e /test-live) que monta UMA
      activity sem escrever no banco.
    entry: src/pages/author/

  - type: ui
    name: admin-back-office
    description: >
      Back-office do tenant — roster, programas, engajamento, artifacts.
    entry: src/pages/admin/

  - type: ui
    name: code-editor
    description: >
      Editor Monaco self-hosted (sem CDN externa em runtime) com preview
      client-only em iframe sandboxed para o kind `code`.
    entry: src/components/editor/

consumes:
  - external: true
    name: supabase-itera
    description: Projeto Supabase da Itera (kjefmwlopzeaqgqtlbdn) — auth, dados e RLS
    env_var: VITE_SUPABASE_URL

  - external: true
    name: itera-api
    description: Responder + judge do sandbox BYOC ao vivo
    env_var: VITE_ITERA_API_URL

  - external: true
    name: "@iterahq/activity-spec"
    description: >
      Schemas Zod por kind (safeParseActivitySpec) + os reducers puros do
      runtime dos DOIS kinds de sandbox: chat_sandbox (ChatModel) e
      terminal_sandbox (TerminalModel + engines resolvidos por nome).
      Resolve do GitHub Packages privado (^1.0.0, registry
      npm.pkg.github.com) desde 2026-08-04 — antes vinha como .tgz
      vendorizado no repo.

  - external: true
    name: opentelemetry-collector
    description: OTel traces and metrics export endpoint
    env_var: VITE_OTEL_API_KEY

environment:
  required:
    - name: VITE_SUPABASE_URL
      description: URL do projeto Supabase da Itera
    - name: VITE_SUPABASE_ANON_KEY
      description: Anon key do Supabase (RLS aplica; sessão do usuário)
  optional:
    - name: STAMP_MANAGED_PREVIEW_URL
      description: Internal CI launcher handoff to its already-bound loopback preview socket; unset outside the launcher.
      default: unset
    - name: VITE_ITERA_API_URL
      description: Base da itera-api (responder/judge do BYOC ao vivo)
    - name: VITE_ITERA_API_BASE
      description: Base alternativa da itera-api
    - name: VITE_DFL_HANDOFF_URL
      description: Handoff de auth vindo do DFL Learn
    - name: VITE_OTEL_API_KEY
      description: API key para export de traces/métricas OpenTelemetry
    - name: VITE_OTEL_ENABLED
      description: Liga/desliga a instrumentação de observabilidade (true/false)
      default: "true"
    - name: VITE_SENTRY_DSN
      description: DSN do Sentry
    # ⚠️ NÃO é VITE_*: é lido pelo vite.config.ts no processo de build, nunca
    # pelo app. Liga o plugin scripts/source-stamp.ts, que carimba
    # data-source="<arquivo>:<linha>" em cada elemento host — só para o build de
    # CAPTURA do mapa de UX. Ausente = desligado, e o CI prova isso sobre o
    # dist/ (npm run assert:no-source-stamp). Nunca em produção: peso morto e
    # expõe o layout de um repo privado. Ver CLAUDE.md.
    - name: ITERA_SOURCE_STAMP
      description: >
        Build de captura do mapa de UX. `1` liga o carimbo data-source.
      default: "unset (off)"

health_check:
  command: npm run build
  test_command: npm run test

scripts:
  dev: npm run dev
  build: npm run build
  test: npm run test
  lint: npm run lint
  typecheck: npm run typecheck
  storybook: npm run storybook

agent_entry_point: CLAUDE.md

activity_kinds:
  # ⚠️ LISTA VERIFICADA. scripts/verify-activity-kinds.mjs compara esta lista,
  # nome a nome, com o enum itera.activity_kind derivado de db/migrations/*.sql
  # (e com db/census/expected-schema.txt). Editar aqui sem a migration = CI
  # vermelha, e vice-versa. Rode `node scripts/verify-activity-kinds.mjs`.
  #
  # Espelha o union ActivityKind em src/types/content.ts, ACTIVITY_KINDS de
  # @iterahq/activity-spec e iterahq/itera-mcp:src/tools/activities.ts.
  # Os três precisam continuar em sincronia.
  #
  # sandbox_scenario está DEPRECADO, não retirado: valor vivo no enum, ZERO
  # linhas o carregam desde o DML de 2026-08-10 (as 48 viraram chat_sandbox), e
  # o Postgres não tem ALTER TYPE ... DROP VALUE. A remoção no pacote/app está
  # em iterahq/itera-player#353, ABERTA — essa PR não contém migration.
  - concept
  - concept_reveal
  - document
  - diagram
  - video
  - quiz
  - single_choice
  - multi_choice
  - match
  - order
  - code
  - chat_sandbox
  - terminal_sandbox
  - sandbox_scenario

testing:
  framework: vitest
  config: vitest.config.ts
  pattern: "src/**/*.test.{ts,tsx}"
  coverage: false
  e2e:
    framework: playwright
    config: playwright.config.ts
    dir: e2e/
    in_pr_gate: false # workflow_dispatch + cron diário, capability-gated
    # Duas suítes hermeticas rodam contra `vite preview` da própria árvore, sem
    # credencial, e BLOQUEIAM toda PR. Cada uma tem config própria porque o
    # substrato difere: a segunda builda com ITERA_SOURCE_STAMP=1, e a primeira
    # tem que continuar caracterizando o build PADRÃO.
    hermetic_pr_gates:
      - config: playwright.baseline.config.ts
        script: npm run e2e:baseline
        proves: o comportamento das activities não mudou nesta PR
      # UMA config, DOIS projects, UMA invocação. `npm run e2e:stamp` não passa
      # `--project` de propósito: o custo dominante é o `vite build` do
      # `webServer`, `reuseExistingServer` é falso sob CI, e dois comandos
      # separados buildariam a mesma árvore duas vezes por PR.
      - config: playwright.stamp.config.ts
        project: stamp
        script: npm run e2e:stamp
        proves: cada carimbo data-source resolve para um arquivo e uma linha reais
      - config: playwright.stamp.config.ts
        project: capture
        script: npm run e2e:stamp  # `npm run e2e:capture` isola este project localmente
        proves: >
          o par screenshot.png + regions.json localiza um clique no arquivo certo,
          e a mesma tela capturada duas vezes sai byte a byte idêntica

observability:
  provider: opentelemetry
  traces: true
  metrics: true
  # Vem do pacote compartilhado @devfellowship/observability
  # (ObservabilityProvider montado em src/App.tsx) — não há mais
  # src/components/observability/ neste repo.  # verify-docs:allow-missing
  package: "@devfellowship/observability"
  # ⚠️ Os pacotes @opentelemetry/* e @sentry/react estão em `dependencies`
  # (~2,5 MB instalados) mas têm ZERO import direto em src/ — só o wrapper
  # @devfellowship/observability é importado (src/App.tsx). Remover as deps
  # diretas versus finalmente ligar a instrumentação é decisão pendente do
  # Tainan (question aberta no plans-app); NÃO mexa nelas por conta própria.

# Native metadata bridge0094: provenance remains; explicit source_metadata_keys
# selects native INSERT. Conflicting dual metadata fails. Caller grants, RLS,
# immutable receipt validation and status lock order remain unchanged.

# Native SQL consumers0095: record_extraction_pass and write_residue_repass insert
# explicit native metadata. Receipt validation reconstructs the unchanged wire
# request. Status and digest eligibility read native pass fields. No JSON drop.

# Canonical census version3 includes learning and preserves itera/billing facts.
# Enabled trigger state and explicit column ACLs protect the metadata bridge and
# status-only UPDATE contract. Actual merged migrations determine the snapshot.
# The immutable0093 metadata prefix has a separate version3 expectation generated
# by the same census. Final-main parity and the full transition remain required.

# A2 native projection0097: exact immutable0088 key arrays and PostgreSQL JSONB
# hashes. Caller-scoped read-only verifier; no automatic reverse, row repair,
# physical provenance drop, or ingest_batch_id removal.

# Core contraction 0099: physical evidence.provenance, checkpoints and
# generation_config retire only after the locked preservation checks and runtime
# release gates. Native fields, ingest_batch_id and legacy capability links stay.
# Historical prefix and populated suffix have exact separate census expectations.
