# repo-contract.yaml — Machine-readable contract for itera-player
# Defines provided interfaces, consumed dependencies, environment,
# health checks, and agent integration metadata.
#
# 2026-07-28: reescrito. Este arquivo descrevia o engine gamificado LEGADO
# (FixTheCode/BreakAndFix/… + src/pages/LessonPage.tsx), herdado do scaffold de  # verify-docs:allow-missing
# dfl-iterate no commit de fundação deste repo. Aquele engine foi aposentado
# (ADR-12 do plano 20260728-itera-activity-testing) e os paths não existem
# mais. Ver CLAUDE.md para o engine canônico.

name: itera-player
description: >
  Itera player — app de aluno/instrutor da Itera (app.iterahq.dev). Roda
  lições e activities vindas do Supabase da Itera, com aula ao vivo,
  superfície de autoria e back-office admin.

type: platform
version: 1.0.0

owner:
  team: itera
  github: "@taigfs @SamuelStefano"

stack:
  runtime: browser
  framework: react-18
  bundler: vite-8
  language: typescript-5
  styling: tailwind-css
  ui_library: shadcn-ui + "@devfellowship/components"
  editor: monaco-editor
  animations: framer-motion
  state: tanstack-react-query
  data: supabase
  testing: vitest + playwright
  observability: opentelemetry

provides:
  - type: ui
    name: lesson-player
    description: >
      Player canônico da lição — percorre a sequência de activities de uma
      lição, grava progresso e artifacts no Supabase da Itera.
    entry: src/pages/LessonPlayer.tsx

  - type: ui
    name: activity-engine
    description: >
      Engine canônico de activity. O ActivityRenderer despacha uma linha de
      itera.activities para a view do seu `kind`. Os 12 kinds de
      itera.activity_kind: concept, concept_reveal, document, diagram, video,
      quiz, single_choice, multi_choice, match, order, code, sandbox_scenario.
      Lógica derivada de resposta/correção vive na máquina pura
      src/utils/answerMachine.ts; o gate do ao-vivo em
      src/utils/liveActivityGate.ts.
      Fase C (2026-08-07): as nove kinds sem backend (concept, concept_reveal,
      video, single_choice, multi_choice, match, order — passos 1-3 —,
      sandbox_scenario, com as pastas sandbox/ e terminal/ inteiras, passo 4, e
      code, passo 5), os primitivos e a lógica pura foram extraídos para
      @iterahq/activities em packages/activities/; os caminhos antigos em src/
      viraram re-export de uma linha e src/utils/answerMachine.ts é um desses.
      Editar o pacote, não o shim. O code sai por um SEGUNDO entrypoint
      (@iterahq/activities/code, ADR-5) e não está em BUILT_IN_ACTIVITY_KINDS:
      o host o registra em ActivityHostContext.renderers. O Monaco fica no app
      (src/components/editor/CodeEditor.tsx) e é injetado pela porta codeEditor,
      e o rascunho passa pela porta storage. Ficaram no app: sandbox-live/,
      byoc/, JudgeHeatmap e os kinds inline no dispatcher.
    entry: src/components/branded/activity/

  - type: ui
    name: live-class
    description: >
      Aula ao vivo — stage do instrutor, timer/gate, roster ranqueado, podium
      e a sessão do lado do aluno.
    entry: src/pages/live/

  - type: ui
    name: authoring
    description: >
      Superfície de autoria + harness isolado de activity
      (/author/activities/:activityId/test e /test-live) que monta UMA
      activity sem escrever no banco.
    entry: src/pages/author/

  - type: ui
    name: admin-back-office
    description: >
      Back-office do tenant — roster, programas, engajamento, artifacts.
    entry: src/pages/admin/

  - type: ui
    name: code-editor
    description: >
      Editor Monaco self-hosted (sem CDN externa em runtime) com preview
      client-only em iframe sandboxed para o kind `code`.
    entry: src/components/editor/

consumes:
  - external: true
    name: supabase-itera
    description: Projeto Supabase da Itera (kjefmwlopzeaqgqtlbdn) — auth, dados e RLS
    env_var: VITE_SUPABASE_URL

  - external: true
    name: itera-api
    description: Responder + judge do sandbox BYOC ao vivo
    env_var: VITE_ITERA_API_URL

  - external: true
    name: "@iterahq/activity-spec"
    description: >
      Schemas Zod por kind (safeParseActivitySpec) + os reducers puros do
      runtime do sandbox_scenario — os DOIS sandboxKinds: `cloud-core-chat`
      (ChatModel) e `terminal` (TerminalModel + engines resolvidos por nome).
      Resolve do GitHub Packages privado (^0.9.0, registry
      npm.pkg.github.com) desde 2026-08-04 — antes vinha como .tgz
      vendorizado no repo.

  - external: true
    name: opentelemetry-collector
    description: OTel traces and metrics export endpoint
    env_var: VITE_OTEL_API_KEY

environment:
  required:
    - name: VITE_SUPABASE_URL
      description: URL do projeto Supabase da Itera
    - name: VITE_SUPABASE_ANON_KEY
      description: Anon key do Supabase (RLS aplica; sessão do usuário)
  optional:
    - name: VITE_ITERA_API_URL
      description: Base da itera-api (responder/judge do BYOC ao vivo)
    - name: VITE_ITERA_API_BASE
      description: Base alternativa da itera-api
    - name: VITE_DFL_HANDOFF_URL
      description: Handoff de auth vindo do DFL Learn
    - name: VITE_OTEL_API_KEY
      description: API key para export de traces/métricas OpenTelemetry
    - name: VITE_OTEL_ENABLED
      description: Liga/desliga a instrumentação de observabilidade (true/false)
      default: "true"
    - name: VITE_SENTRY_DSN
      description: DSN do Sentry
    # ⚠️ NÃO é VITE_*: é lido pelo vite.config.ts no processo de build, nunca
    # pelo app. Liga o plugin scripts/source-stamp.ts, que carimba
    # data-source="<arquivo>:<linha>" em cada elemento host — só para o build de
    # CAPTURA do mapa de UX. Ausente = desligado, e o CI prova isso sobre o
    # dist/ (npm run assert:no-source-stamp). Nunca em produção: peso morto e
    # expõe o layout de um repo privado. Ver CLAUDE.md.
    - name: ITERA_SOURCE_STAMP
      description: >
        Build de captura do mapa de UX. `1` liga o carimbo data-source.
      default: "unset (off)"

health_check:
  command: npm run build
  test_command: npm run test

scripts:
  dev: npm run dev
  build: npm run build
  test: npm run test
  lint: npm run lint
  typecheck: npm run typecheck
  storybook: npm run storybook

agent_entry_point: CLAUDE.md

activity_kinds:
  # Espelha o union ActivityKind em src/types/content.ts, ACTIVITY_KINDS de
  # @iterahq/activity-spec e iterahq/itera-mcp:src/tools/activities.ts.
  # Os três precisam continuar em sincronia.
  - concept
  - concept_reveal
  - document
  - diagram
  - video
  - quiz
  - single_choice
  - multi_choice
  - match
  - order
  - code
  - sandbox_scenario

testing:
  framework: vitest
  config: vitest.config.ts
  pattern: "src/**/*.test.{ts,tsx}"
  coverage: false
  e2e:
    framework: playwright
    config: playwright.config.ts
    dir: e2e/
    in_pr_gate: false # workflow_dispatch + cron diário, capability-gated
    # Duas suítes hermeticas rodam contra `vite preview` da própria árvore, sem
    # credencial, e BLOQUEIAM toda PR. Cada uma tem config própria porque o
    # substrato difere: a segunda builda com ITERA_SOURCE_STAMP=1, e a primeira
    # tem que continuar caracterizando o build PADRÃO.
    hermetic_pr_gates:
      - config: playwright.baseline.config.ts
        script: npm run e2e:baseline
        proves: o comportamento das activities não mudou nesta PR
      - config: playwright.stamp.config.ts
        script: npm run e2e:stamp
        proves: cada carimbo data-source resolve para um arquivo e uma linha reais

observability:
  provider: opentelemetry
  traces: true
  metrics: true
  # Vem do pacote compartilhado @devfellowship/observability
  # (ObservabilityProvider montado em src/App.tsx) — não há mais
  # src/components/observability/ neste repo.  # verify-docs:allow-missing
  package: "@devfellowship/observability"
  # ⚠️ Os pacotes @opentelemetry/* e @sentry/react estão em `dependencies`
  # (~2,5 MB instalados) mas têm ZERO import direto em src/ — só o wrapper
  # @devfellowship/observability é importado (src/App.tsx). Remover as deps
  # diretas versus finalmente ligar a instrumentação é decisão pendente do
  # Tainan (question aberta no plans-app); NÃO mexa nelas por conta própria.
