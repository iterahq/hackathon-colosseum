# Checks of the mobile shell (apps/mobile). PLAN ADR-13: one job, path-filtered, self-hosted.
#
# The fleet runner is loaded and its root disk is nearly full, so the first step reads the free
# disk and skips the install steps below 3 GB (it prints `skipped: runner disk <n> GB` instead of
# failing or proceeding). Steps: df, npm ci, tsc, the shell's Vitest, expo-doctor, check:expo-go-sdk,
# the iOS export, check:one-react, web-inert (PLAN ADR-13; PR-1 had the first, second, third and last
# of these, PR-2 adds Vitest, expo-doctor, the export and check:one-react). Row 0.24 is read from
# the first PR-2 run: at most 10 minutes with at least 3 GB free. If not, the export and
# check:one-react come out of the job and their output is pasted in the PR (PLAN row 0.24).
name: mobile-shell

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/bridge/**"
      - "packages/core/**"
      - "packages/screens/**"
      - ".github/workflows/mobile-shell.yml"
  schedule:
    # Weekly: Expo Go moves to a new SDK without a PR to tell us.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: mobile-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-shell:
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disk guard
        id: disk
        run: |
          set -euo pipefail
          df -h .
          free_kb="$(df --output=avail -k . | tail -1 | tr -d ' ')"
          free_gb=$((free_kb / 1024 / 1024))
          if [ "$free_gb" -lt 3 ]; then
            echo "skipped: runner disk ${free_gb} GB"
            echo "install=false" >> "$GITHUB_OUTPUT"
          else
            echo "install=true" >> "$GITHUB_OUTPUT"
          fi

      # Node is needed by every run (the schedule and the low-disk run included): the bare runner has
      # no npm on PATH. No `cache:` option (it fails without a lockfile); the self-hosted host keeps ~/.npm between runs.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A skipped install is a green run that compiled and tested nothing: say so in the annotations and the summary.
      - name: Warn when apps/mobile is not built
        if: github.event_name == 'pull_request' && steps.disk.outputs.install != 'true'
        run: |
          echo "::warning title=mobile-shell skipped::apps/mobile was NOT compiled or tested on this run (runner disk below 3 GB)"
          echo "apps/mobile was NOT compiled or tested on this run (runner disk below 3 GB). Do not merge on this run." >> "$GITHUB_STEP_SUMMARY"

      # Runs before the install steps and does not need them, so a failing doctor or export cannot hide it.
      # REPORTS web-inert=yes|no (annotation and step summary, naming the paths that made it "no") and does
      # not fail on a "no": a web-touching PR is legitimate (PLAN ADR-14), and ADR-13's wording "fails"
      # contradicts R-6, which owns the lint rule in eslint.config.js. When the diff IS inert, the allowance
      # script fails on an eslint.config.js, renovate.json, .dockerignore or .gitignore edit outside its one
      # allowed place. An empty diff or a script error fails.
      - name: Web inert
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only --no-renames origin/main...HEAD)"
          if [ -z "$changed" ]; then echo "web-inert: empty diff"; exit 1; fi
          offending="$(printf '%s\n' "$changed" | grep -vE '^(apps/mobile/|scripts/mobile/|\.github/workflows/mobile-|\.github/CODEOWNERS$|docs/|repo-contract\.yaml$|renovate\.json$|\.dockerignore$|\.gitignore$|eslint\.config\.js$|[^/]+\.md$)' || true)"
          if [ -n "$offending" ]; then
            echo "web-inert=no" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=web-inert=no::web-touching PR (ADR-14): two reviews, full CI, post-deploy check. Paths: $(printf '%s' "$offending" | tr '\n' ' ')"
            { echo "Web-touching paths:"; printf '%s\n' "$offending" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "web-inert=yes" | tee -a "$GITHUB_STEP_SUMMARY"
            node apps/mobile/scripts/web-inert.mjs
          fi

      # Reads the shell's `expo` range and the public Expo versions endpoint; needs no install.
      - name: Expo Go SDK
        run: npm --prefix apps/mobile run check:expo-go-sdk

      - name: Install (npm ci)
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm ci
        working-directory: apps/mobile

      - name: Typecheck
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm --prefix apps/mobile run typecheck

      # Pure-TypeScript unit tests with the shell's own config: without it Vitest walks up to the root config.
      - name: Unit tests
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm --prefix apps/mobile run test

      - name: Expo Doctor
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm --prefix apps/mobile run doctor

      # The bundle that check:one-react reads: it needs the source maps under dist-ios.
      - name: Export (iOS)
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm --prefix apps/mobile run bundle:ios

      - name: One React
        if: github.event_name == 'pull_request' && steps.disk.outputs.install == 'true'
        run: npm --prefix apps/mobile run check:one-react
