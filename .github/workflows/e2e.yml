name: E2E (Itera↔Fellowship)

# Heavy end-to-end harness (plan #7). Needs BOTH apps live (dfl-learn +
# itera-api), the dfl-batch Results-API key, and learn login creds. It is
# deliberately NOT part of the per-PR `ci.yml` gate — it runs MANUALLY
# (workflow_dispatch) or on a daily SCHEDULE.
#
# 🚨 GREEN MUST MEAN "IT RAN AND PASSED" (Tainan, 2026-07-28) 🚨
#
# This workflow used to advertise "green-with-skips" as a feature. It was not
# one: the repo has never held `ITERA_SMOKE_*`, `CLAUDE_SMOKE_*` or
# `DFL_BATCH_RESULTS_API_KEY` as Actions secrets, so this cron has been GREEN
# for its entire life while executing essentially nothing. `E2E_REQUIRE_CAPABILITIES=1`
# below fixes that: `e2e/preflight.spec.ts` fails ONCE, naming every missing
# secret/substrate and the fix, and the skip census prints every skipped test
# with its reason at the end of every run.
#
# ⚠️ EXPECTED CONSEQUENCE, AND IT IS CORRECT: until the secrets are provisioned
# this scheduled run goes RED. Red here means "we are not testing", which is
# true today. Do NOT weaken the check to restore the green — provision the
# secrets (a blocking question is open with Tainan for `ITERA_SMOKE_*`).
#
# Also carries the per-kind author-harness smoke (plan
# 20260728-itera-activity-testing, Fase 4 / tier T3): one activity per kind
# driven through /author/activities/:id/test, which writes nothing to the DB.
# And the responsive fan-out (`@responsive`, mobile/tablet/desktop projects —
# see playwright.config.ts). ADR-3 of that plan is binding — Playwright stays
# OUT of the per-PR `ci.yml` gate; this workflow is its only home. Adding
# viewports changed nothing about that.
#
# ⚠️ Failure alerting is whatever GitHub does by default for a failed scheduled
# run (an email to the workflow file's last committer). The repo has no other
# notification path today and this workflow deliberately does not invent one.
#
# Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29 — was ubuntu-latest).
#
# The 2026-07-28 note below turned out to be the whole story: this repo is
# PRIVATE, so every ubuntu-latest minute this daily cron burned was BILLABLE
# against the iterahq org's Actions allowance. On 2026-07-29 that allowance hit
# 2000/2000 with no overage, and every run across the org — this one included —
# started failing in ~3 seconds with no runner assigned and zero steps executed.
# So iterahq got its OWN org-scoped runners on the two dfl-runner VPSes we
# already own (registrations are per-org, so they are separate from the
# devfellowship ones; the labels are identical). Self-hosted minutes are free,
# which removes this workflow from the billing path entirely. Being private is
# also exactly what makes self-hosted safe here — the fork-PR RCE hazard that
# bans self-hosted on public repos does not apply.
#
# The earlier claim that "org-scoped self-hosted runners aren't available to
# other orgs" was only ever true of the DEVFELLOWSHIP registrations. It was
# never a reason iterahq could not register runners of its own.
#
# ⚠️ Capacity note for this workflow specifically: `npm run e2e:install` is
# `playwright install --with-deps chromium`, which apt-installs browser
# dependencies inside the runner container on every run. The runner containers
# are recycled every 2h, so this cost recurs — acceptable for a once-daily cron,
# but do not fan this workflow out to per-PR without re-measuring host disk.
# Full rationale in ci.yml; infra in devfellowship/dfl-infra:vps/dfl-runner/.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # See the runner note at the top of this file.
    runs-on: [self-hosted, dfl-runner]
    # 20 -> 30: the suite now runs three viewport projects (desktop full,
    # mobile+tablet @responsive only). Measured 2026-07-28 with no secrets, so
    # nearly everything skips: desktop-only 3.8s, all three projects 11.0s. The
    # headroom is for the day the credentials land and the specs actually drive
    # the app — a cancelled job would read as a different failure than a red one.
    timeout-minutes: 30
    env:
      # The switch that turns "silently skipped" into "loudly failed". Every env
      # DECLARED in this block is a capability CI promises to provide; absence is
      # a preflight FAILURE (e2e/support/capabilities.ts holds the registry and
      # the rule). Unset locally, so a developer without credentials still gets
      # the old skip behaviour and is not blocked.
      E2E_REQUIRE_CAPABILITIES: '1'
      ITERA_API_URL: ${{ vars.ITERA_API_URL || 'https://api.iterahq.dev' }}
      LEARN_BASE_URL: ${{ vars.LEARN_BASE_URL || 'https://learn.devfellowship.com' }}
      DFL_BATCH_RESULTS_API_KEY: ${{ secrets.DFL_BATCH_RESULTS_API_KEY }}
      CLAUDE_SMOKE_USERNAME: ${{ secrets.CLAUDE_SMOKE_USERNAME }}
      CLAUDE_SMOKE_PASSWORD: ${{ secrets.CLAUDE_SMOKE_PASSWORD }}
      # The Itera player itself (app.iterahq.dev) — the substrate for
      # `author-activity-kinds.spec.ts` (plan 20260728-itera-activity-testing,
      # Fase 4 / T3) and for the already-present `route-access-matrix.spec.ts`,
      # which skipped unconditionally until this block existed.
      ITERA_BASE_URL: ${{ vars.ITERA_BASE_URL || 'https://app.iterahq.dev' }}
      # tenant_admin of the `itera` tenant. NOT a learner, and NOT `author` in
      # `dfl-batch` — so the per-kind smoke only reaches the kinds the `itera`
      # tenant authors, and skips (never fails) on the rest. See the spec header.
      #
      # ⚠️ These two secrets DO NOT EXIST in this repo yet — a blocking question
      # is open with Tainan (plan 20260728-itera-activity-testing). Until they
      # are provisioned the preflight fails and this cron is RED, which is the
      # honest report: nothing that needs a login is being tested.
      ITERA_SMOKE_USERNAME: ${{ secrets.ITERA_SMOKE_USERNAME }}
      ITERA_SMOKE_PASSWORD: ${{ secrets.ITERA_SMOKE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Playwright browsers
        run: npm run e2e:install

      # `npm run e2e` runs all three viewport projects: `desktop` (whole suite)
      # plus `mobile` and `tablet` (only the `@responsive` tests). The skip
      # census prints at the end and also lands in the job summary.
      - name: Run E2E harness (capability-enforced)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
