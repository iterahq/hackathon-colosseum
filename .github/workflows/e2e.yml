name: E2E (Itera player)

# Heavy end-to-end harness. It drives the deployed Itera player and is
# deliberately NOT part of the per-PR `ci.yml` gate — it runs MANUALLY
# (workflow_dispatch) or on a daily SCHEDULE.
#
# 🔻 SCOPE SHRANK, 2026-08-13. This workflow was named "Itera↔Fellowship"
# because it carried `itera-fellowship.spec.ts`, the only spec that crossed into
# dfl-learn. That spec is DELETED and the DFL↔ITERA federated embed now has no
# automated coverage at all. The reason is recorded in `e2e/README.md`, under
# "What is NOT covered" — read it before you assume the loop is tested.
#
# 🚨 GREEN MUST MEAN "IT RAN AND PASSED" (Tainan, 2026-07-28) 🚨
#
# This workflow used to advertise "green-with-skips" as a feature. It was not
# one: the repo has never held `ITERA_SMOKE_*` or `CLAUDE_SMOKE_*` as Actions
# secrets, so this cron has been GREEN for its entire life while executing
# essentially nothing. `E2E_REQUIRE_CAPABILITIES=1`
# below fixes that: `e2e/preflight.spec.ts` fails ONCE, naming every missing
# secret/substrate and the fix, and the skip census prints every skipped test
# with its reason at the end of every run.
#
# ✅ THE SECRETS EXIST NOW (2026-08-13). The four names this workflow declares
# — ITERA_SMOKE_USERNAME, ITERA_SMOKE_PASSWORD, CLAUDE_SMOKE_USERNAME,
# CLAUDE_SMOKE_PASSWORD — are repo Actions secrets, sourced from Infisical
# `/shared`. Before that the run had failed 10 times out of its last 10, always
# on the same preflight assertion, always naming the same three capabilities.
#
# Do NOT weaken the check to restore a green. A red here still means "we are not
# testing", and that is now a real signal instead of a standing condition.
#
# ⚠️ WHAT THIS SUITE TOUCHES: live production. app.iterahq.dev, daily, as a real
# tenant_admin of the `itera` tenant. Any spec added here inherits that.
# (`api.iterahq.dev` and `learn.devfellowship.com` left the blast radius with
# `itera-fellowship.spec.ts`.)
#
# 📏 MEASURED, 2026-08-13 — and it corrects the sentence that used to sit here
# ("opening a diagram lesson writes an attempt row"). A full run was diffed
# against exact row counts of ALL 30 tables in the `itera` schema, before and
# after. Exactly ONE table moved: `class_sessions`, +3 rows, all as the
# `itera-smoke` tenant_admin — the live-sidebar test in `responsive-shell.spec.ts`
# starting and ending a class once per viewport project. `activity_results`,
# `activity_traces`, `progress`, `class_answers`, `xp_events` and `artifacts` did
# not move at all.
#
# So this suite currently writes NO learner rows, for three separate reasons, and
# none of them is a defect in the app:
#   · the specs that would write as a LEARNER (`artifact-persistence`,
#     `live-instructor-routed`) skip — `ITERA_E2E_ALUNO1/2_*`, `ITERA_E2E_PROF_*`
#     and `ITERA_E2E_LESSON_ID` are `tier: 'optional'` and were never provisioned
#     as Actions secrets. They exist in Infisical `/apps/itera`;
#   · `author-activity-kinds` drives the author harness, which writes nothing BY
#     DESIGN (that boundary is what keeps author testing out of learner data);
#   · `itera-fellowship` was the one genuine write spec that ran, and it FAILED
#     before it settled anything. It is now deleted, so that row is gone for
#     good, not merely failing.
# Do not read the absent rows as "the app stopped recording attempts".
#
# Also carries the per-kind author-harness smoke (plan
# 20260728-itera-activity-testing, Fase 4 / tier T3): one activity per kind
# driven through /author/activities/:id/test, which writes nothing to the DB.
# And the responsive fan-out (`@responsive`, mobile/tablet/desktop projects —
# see playwright.config.ts). ADR-3 of that plan is binding — Playwright stays
# OUT of the per-PR `ci.yml` gate; this workflow is its only home. Adding
# viewports changed nothing about that.
#
# ⚠️ FAILURE ALERTING. A daily cron whose failure only mails one person is a
# cron nobody reads. The last step of the job opens a GitHub issue when the run
# fails, comments on it when it fails again, and CLOSES it when the suite goes
# green — the same shape db-drift.yml already uses, so there is one place to
# look and it is a place humans already look. The run still goes red: loud in
# both places, per that workflow's own rule.
#
# Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29 — was ubuntu-latest).
#
# The 2026-07-28 note below turned out to be the whole story: this repo is
# PRIVATE, so every ubuntu-latest minute this daily cron burned was BILLABLE
# against the iterahq org's Actions allowance. On 2026-07-29 that allowance hit
# 2000/2000 with no overage, and every run across the org — this one included —
# started failing in ~3 seconds with no runner assigned and zero steps executed.
# So iterahq got its OWN org-scoped runners on the two dfl-runner VPSes we
# already own (registrations are per-org, so they are separate from the
# devfellowship ones; the labels are identical). Self-hosted minutes are free,
# which removes this workflow from the billing path entirely. Being private is
# also exactly what makes self-hosted safe here — the fork-PR RCE hazard that
# bans self-hosted on public repos does not apply.
#
# The earlier claim that "org-scoped self-hosted runners aren't available to
# other orgs" was only ever true of the DEVFELLOWSHIP registrations. It was
# never a reason iterahq could not register runners of its own.
#
# ⚠️ Capacity note for this workflow specifically: `npm run e2e:install` is
# `playwright install --with-deps chromium`, which apt-installs browser
# dependencies inside the runner container on every run. The runner containers
# are recycled every 2h, so this cost recurs — acceptable for a once-daily cron,
# but do not fan this workflow out to per-PR without re-measuring host disk.
# Full rationale in ci.yml; infra in devfellowship/dfl-infra:vps/dfl-runner/.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

permissions:
  contents: read
  packages: read
  # The failure-notification step opens, comments on and closes ONE issue.
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # See the runner note at the top of this file.
    runs-on: [self-hosted, dfl-runner]
    # 20 -> 30: the suite now runs three viewport projects (desktop full,
    # mobile+tablet @responsive only). Measured 2026-07-28 with no secrets, so
    # nearly everything skips: desktop-only 3.8s, all three projects 11.0s. The
    # headroom is for the day the credentials land and the specs actually drive
    # the app — a cancelled job would read as a different failure than a red one.
    timeout-minutes: 30
    env:
      # The switch that turns "silently skipped" into "loudly failed". Every env
      # DECLARED in this block is a capability CI promises to provide; absence is
      # a preflight FAILURE (e2e/support/capabilities.ts holds the registry and
      # the rule). Unset locally, so a developer without credentials still gets
      # the old skip behaviour and is not blocked.
      E2E_REQUIRE_CAPABILITIES: '1'
      # `ITERA_API_URL`, `LEARN_BASE_URL` and `DFL_BATCH_RESULTS_API_KEY` were
      # declared here for `itera-fellowship.spec.ts`, which is deleted (see
      # e2e/README.md). Declaring an env here MAKES it a required capability,
      # so leaving them would demand a secret for zero assertions. The
      # `DFL_BATCH_RESULTS_API_KEY` Actions secret itself is left in place — it
      # is a real key, and this workflow is no longer its consumer.
      CLAUDE_SMOKE_USERNAME: ${{ secrets.CLAUDE_SMOKE_USERNAME }}
      CLAUDE_SMOKE_PASSWORD: ${{ secrets.CLAUDE_SMOKE_PASSWORD }}
      # The Itera player itself (app.iterahq.dev) — the substrate for
      # `author-activity-kinds.spec.ts` (plan 20260728-itera-activity-testing,
      # Fase 4 / T3) and for the already-present `route-access-matrix.spec.ts`,
      # which skipped unconditionally until this block existed.
      ITERA_BASE_URL: ${{ vars.ITERA_BASE_URL || 'https://app.iterahq.dev' }}
      # tenant_admin of the `itera` tenant. NOT a learner, and NOT `author` in
      # `dfl-batch` — so the per-kind smoke only reaches the kinds the `itera`
      # tenant authors, and skips (never fails) on the rest. See the spec header.
      #
      # ⚠️ These two secrets DO NOT EXIST in this repo yet — a blocking question
      # is open with Tainan (plan 20260728-itera-activity-testing). Until they
      # are provisioned the preflight fails and this cron is RED, which is the
      # honest report: nothing that needs a login is being tested.
      ITERA_SMOKE_USERNAME: ${{ secrets.ITERA_SMOKE_USERNAME }}
      ITERA_SMOKE_PASSWORD: ${{ secrets.ITERA_SMOKE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npm run e2e:install

      # `npm run e2e` runs all three viewport projects: `desktop` (whole suite)
      # plus `mobile` and `tablet` (only the `@responsive` tests). The skip
      # census prints at the end and also lands in the job summary.
      - name: Run E2E harness (capability-enforced)
        id: harness
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # ONE issue, not one per day. A cron that files a fresh issue every
      # morning is the same silence as no issue at all — the list becomes
      # noise and stops being read. So: open it once, comment while it stays
      # broken, close it the day the suite passes. Modelled on the identical
      # step in db-drift.yml, deliberately not a second pattern.
      #
      # It runs only on the SCHEDULE. A workflow_dispatch is somebody watching
      # the run already; filing an issue at them is noise.
      - name: Open, update or close the e2e issue
        if: always() && github.event_name == 'schedule'
        env:
          OUTCOME: ${{ steps.harness.outcome }}
          GH_TOKEN: ${{ github.token }}
          TITLE: '[e2e] the daily Itera↔Fellowship suite is failing'
        run: |
          set -u
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)"

          if [ "$OUTCOME" = "success" ]; then
            echo ":white_check_mark: the suite ran and passed." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "The suite is green again as of ${RUN_URL}."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          BODY="$(printf 'The daily E2E suite failed against live production.\n\n- run: %s\n- targets: `app.iterahq.dev`, `api.iterahq.dev`, `learn.devfellowship.com`\n\nHow to read it:\n\n- **preflight failed** — a capability CI is supposed to provide is absent. The failure names every missing secret and the fix. All five Actions secrets were provisioned on 2026-08-13; a preflight failure now means one expired, was deleted, or a probed host is down.\n- **a spec failed** — a real regression, or production is down. The Playwright report is attached to the run as an artefact.\n- **skips** — the skip census at the end of the run lists every test that did not run and why. A skip is UNVERIFIED, not passing.\n\nThis issue is reused, not reopened daily. It closes itself when the suite goes green.\n' "$RUN_URL")"

          printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing as of ${RUN_URL}."
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug
          fi
