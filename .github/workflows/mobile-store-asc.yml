# App Store Connect listing of the iOS shell (apps/mobile): status, push, submit.
# Named mobile-* on purpose: the web-inert allow-list of mobile-shell.yml lets `.github/workflows/mobile-` through
# and nothing else, so a workflow with another prefix would make the PR "web-touching".
#
# Manual only, main only. The key file is written in the step that needs it (umask 077) and removed in an
# always() step; the secrets are set on those steps only. The review contact and the demo account are secrets
# that may not exist yet: `status` runs without them and `push` skips the fields with a warning.
#
#   status        read-only: versions, builds, the listing per locale, what still blocks a submission
#   push-dry-run  the planned writes, GETs only
#   push          writes store/metadata.json and store/screenshots into App Store Connect
#   submit        needs `confirm` = the bundle id and an empty blocking list; sends the version to review
#
# Secrets (repo): ASC_API_KEY_P8, ASC_API_KEY_ID, ASC_API_ISSUER_ID (already used by mobile-eas.yml);
# ASC_REVIEW_CONTACT_FIRST_NAME, ASC_REVIEW_CONTACT_LAST_NAME, ASC_REVIEW_CONTACT_EMAIL, ASC_REVIEW_CONTACT_PHONE,
# ASC_REVIEW_DEMO_USER, ASC_REVIEW_DEMO_PASSWORD (owner: a human adds them).
name: mobile-store-asc

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, push-dry-run, push, submit]
        default: status
      version:
        description: App Store version string, e.g. 0.3.0 (needed by push and submit)
        type: string
        default: ''
      build_number:
        description: Optional. The build number (CFBundleVersion) to attach on push
        type: string
        default: ''
      confirm:
        description: submit only. Must equal the bundle id, com.tainanfidelis.iterahq
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-store-asc
  cancel-in-progress: false

jobs:
  asc:
    name: ${{ inputs.action }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ "$ACTION" != "status" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Bad version::version must look like 0.3.0 for ${ACTION}."
            exit 1
          fi
          if [ -n "$BUILD_NUMBER" ] && ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Bad build number::build_number must be digits only."
            exit 1
          fi

      - name: Write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s\n' "$ASC_API_KEY_P8" > .secrets/asc-api-key.p8

      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CONFIRM: ${{ inputs.confirm }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/apps/mobile/.secrets/asc-api-key.p8
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          ASC_REVIEW_DEMO_USER: ${{ secrets.ASC_REVIEW_DEMO_USER }}
          ASC_REVIEW_DEMO_PASSWORD: ${{ secrets.ASC_REVIEW_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          case "$ACTION" in
            status) node scripts/asc-store.mjs status ${args[@]+"${args[@]}"} ;;
            push-dry-run) node scripts/asc-store.mjs push ${args[@]+"${args[@]}"} --dry-run ${BUILD_NUMBER:+--build-number "$BUILD_NUMBER"} ;;
            push) node scripts/asc-store.mjs push ${args[@]+"${args[@]}"} ${BUILD_NUMBER:+--build-number "$BUILD_NUMBER"} ;;
            submit) node scripts/asc-store.mjs submit ${args[@]+"${args[@]}"} --confirm "$CONFIRM" ;;
          esac

      - name: Remove the key
        if: always()
        run: rm -f .secrets/asc-api-key.p8
