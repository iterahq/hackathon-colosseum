name: Auto-assign PR author

# Housekeeping only — never a merge gate (continue-on-error on step + job).
#
# Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29 — was ubuntu-latest).
# iterahq exhausted its 2000 free GitHub-hosted Actions minutes, so the org now
# runs on its own org-scoped runners on the two dfl-runner VPSes. Full rationale
# in ci.yml; infra in devfellowship/dfl-infra:vps/dfl-runner/.
#
# ⚠️ The old header here claimed this is a PUBLIC repo. It is not —
# `gh api repos/iterahq/itera-player --jq .private` returns `true`. The stated
# blockers followed from that wrong premise: private->private reusable-workflow
# calls are fine, and `allows_public=false` on the runner group is irrelevant for
# a private repo. Keeping the job inlined anyway (it is six lines of
# github-script and has no dependency on dfl-ci).
#
# ⚠️ `pull_request_target` runs the workflow file from the BASE branch, not the
# PR branch — so unlike ci.yml this change only takes effect once merged, and a
# PR cannot test it against itself. It is also why self-hosted is safe here
# despite the elevated token: there is deliberately NO checkout step, so no
# contributor-controlled code ever executes on the runner.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  assign:
    # See the runner note at the top of this file.
    runs-on: [self-hosted, dfl-runner]
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Assign PR author (best-effort)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            const type = context.payload.pull_request.user.type; // "User" or "Bot"

            // [bot] accounts (dependabot, renovate, etc.) cannot be assigned — skip cleanly.
            if (type === 'Bot' || author.endsWith('[bot]')) {
              core.info(`Author "${author}" is a bot account; skipping self-assign (bots can't be assignees).`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author],
              });
              core.info(`Assigned PR #${context.payload.pull_request.number} to ${author}.`);
            } catch (err) {
              core.warning(`Could not assign PR author "${author}" (non-blocking): ${err.message}`);
            }
