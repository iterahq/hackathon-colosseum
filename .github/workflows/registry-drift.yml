name: Registry Drift

# ──────────────────────────────────────────────────────────────────────────────
# THE ALARM FOR `@iterahq/activities`, WHICH IS A SEPARATE THING FROM THE
# AUTOMATION THAT PUBLISHES IT.
#
# WHAT WENT WRONG, AND WHY THIS FILE EXISTS
#
# PR #353 bumped `packages/activities/package.json` to `1.0.0` on 2026-08-17.
# The publish workflow was `workflow_dispatch`-only and nobody dispatched it.
# The registry kept serving `0.4.0` (2026-08-08) as `latest` for 17 DAYS while
# `main` was far ahead. Every consumer who installed the package in that window
# got a version nobody intended to be current. NOTHING ALERTED. The gap closed
# on 2026-08-27 only because somebody went looking for it.
#
# PR #432 made the publish automatic on merge. That removes THAT failure. It
# does NOT remove the CLASS. The same silence returns if the push trigger is
# reverted, if the path filter drifts, if a bump merges while the runner is
# down, or if a publish fails and nobody reads the run. Staleness is only noisy
# when somebody instruments it. This file is the instrument.
#
# It asks one question, daily: DOES THE REGISTRY STILL SERVE WHAT MAIN SAYS?
#
# ── THE RULE THAT MATTERS MOST: IT MUST FAIL WHEN IT CANNOT TELL ─────────────
#
# A monitor that goes green while blind is worse than no monitor at all: it
# converts an outage into a false all-clear, and the person who reads the green
# tick stops looking. So an unreadable packument, an empty token, a refused
# token, a manifest it cannot parse, or a packument with no `dist-tags.latest`
# are all HARD FAILURES here, reported as `VERDICT: BLIND`. There is exactly
# one path to a green run: the check read both numbers and they matched.
#
# ── HOW IT READS THE REGISTRY: IT DOES NOT. IT ASKS THE ONE PROBE ────────────
#
# `scripts/release-activities/release-guard.sh inspect <version>` does the read.
# This file does NOT fetch or parse the packument itself, and it must not start
# to again.
#
# It used to. This workflow and PR #434's extraction of the shared probe landed
# 25 minutes apart on 2026-08-27, so `main` briefly carried TWO independent
# implementations of "ask the registry what exists" — the exact duplication the
# other PR existed to remove. Two copies is HOW the 2026-08 bug survived for
# months: the logic ran on one branch, once per release, and nothing else ever
# exercised it. A second copy here would have rotted the same way, and this one
# runs where nobody is watching.
#
# The probe answers the OBSERVATION — what the registry serves, and whether it
# can be trusted at all. The VERDICT below is this file's own: a 404 means
# "first release, go ahead" to the publish guard and "the worst kind of drift"
# to this monitor. Sharing the read is the point. Sharing the policy would be
# wrong, so it is not shared.
#
# What the probe reads is the PACKUMENT ROOT — `https://npm.pkg.github.com/`
# plus the package name — and this file looks at `dist-tags.latest`.
#
# 🐞 DO NOT change that to a per-version URL. GitHub Packages has NO per-version
# GET route: `.../@iterahq/activities/<version>` answers **405 whether or not
# the version exists**. That exact mistake is what made the old publish guard in
# `release-activities.yml` useless — it compared the status to 200, so it could
# never fire once. Reintroducing it would make this alarm useless in the same
# way, and it would look like it was working. The 22-case stubbed-curl matrix in
# `release-guard.test.ts` pins 405 to "unreadable"; that matrix now covers this
# monitor too, which is the second reason to read through the probe.
#
# Measured against the live registry on 2026-08-27, which is where the HTTP
# handling comes from:
#
#   | request                                    | answer                        |
#   |--------------------------------------------|-------------------------------|
#   | packument, token with `read:packages`       | 200 + the JSON                |
#   | packument, NO token                         | 401 `authentication token ...`|
#   | packument, token WITHOUT `read:packages`    | 403 `... expected scopes`     |
#   | packument of a package that does not exist  | 404 `... does not exist ...`  |
#
# So 401 and 403 mean "I cannot see", which is BLIND. 404 with a working token
# means "the registry genuinely has nothing under this name", which is DRIFT of
# the worst kind, not blindness.
#
# ── AND A 200 CAN ALSO BE BLIND ──────────────────────────────────────────────
#
# The probe refuses a 200 whose body is not JSON, or has no `versions` OBJECT —
# `versions` as an ARRAY or a STRING included, because `Object.keys` answers
# happily for both and hands back list indices as if they were version numbers.
# That was a real hole here: this file used to accept such a body, and if its
# `dist-tags.latest` matched the manifest it reported CLEAN. A malformed body
# read as AGREEMENT is the same false all-clear in a new place.
#
# ── WHY IT OPENS AN ISSUE ────────────────────────────────────────────────────
#
# A red scheduled run in a repo nobody watches is the same silence in a
# different colour — it is precisely the weakness that let 17 days pass. The job
# opens (or updates) ONE GitHub issue, deduped on an exact title, and closes it
# when the drift clears. It ALSO fails, so the Actions view stays honest.
#
# ── WHICH REF IT READS ───────────────────────────────────────────────────────
#
# The plain `actions/checkout@v4` below reads the ref the run was started on. On
# the `schedule` trigger GitHub always starts the run on the DEFAULT BRANCH, so
# the daily question is always "main versus the registry" — which is the
# question this file is for. On `workflow_dispatch` a human can point it at a
# branch, which is how you exercise a change to this file without publishing
# anything. Issues are written ONLY from the default branch, so a branch
# dispatch goes red without opening or closing anything.
#
# RUNNER: `[self-hosted, dfl-runner]` — same iterahq-scoped registrations as
# every other workflow here. See the long rationale at the top of `ci.yml`.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 09:25 UTC ~= 06:25 BRT — before the working day, after any overnight
    # merge, and a quarter hour clear of `db-drift` so the two alarms do not
    # contend for the same runner.
    - cron: '25 9 * * *'
  workflow_dispatch:

concurrency:
  group: registry-drift
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  drift:
    name: does the registry still serve what main says?
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner has no guaranteed ambient Node, and this check parses JSON.
      # A hand-rolled `grep` over a packument is exactly the kind of parse that
      # fails quietly and reports the wrong number.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare the manifest against the registry
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_FILE: ${{ runner.temp }}/registry-drift-report.txt
          # The probe reads `PACKAGE` and falls back to its own default. Name it
          # here anyway: this file's alert text used to hardcode the name
          # separately, so the sentence a human reads and the package actually
          # fetched could disagree without anything going red.
          PACKAGE: '@iterahq/activities'
        run: |
          set -u

          MANIFEST='packages/activities/package.json'
          GUARD='scripts/release-activities/release-guard.sh'
          PKG="$PACKAGE"
          PROBE_ERR="$RUNNER_TEMP/activities-probe.err"

          : > "$REPORT_FILE"
          log() { printf '%s\n' "$*" | tee -a "$REPORT_FILE"; }

          # $1 = clean | drift | blind, then a one-line reason.
          finish() {
            v="$1"; shift
            echo "verdict=$v" >> "$GITHUB_OUTPUT"
            log ""
            case "$v" in
              clean)
                log "VERDICT: CLEAN — main and the registry agree."
                exit 0
                ;;
              drift)
                log "VERDICT: DRIFT — $*"
                echo "::error::registry-drift: $*"
                exit 1
                ;;
              *)
                log "VERDICT: BLIND — $*"
                log "A monitor that cannot tell must go RED. Green here would be a false all-clear."
                echo "::error::registry-drift is BLIND, which is a FAILURE and not an all-clear: $*"
                exit 1
                ;;
            esac
          }

          log "package:          $PKG"
          log "ref read:         $GITHUB_REF_NAME ($GITHUB_SHA)"
          log "registry read by: $GUARD inspect"
          log ""

          # ── 1. what the repository says ──────────────────────────────────
          if [ ! -f "$MANIFEST" ]; then
            finish blind "$MANIFEST does not exist on this ref — the package moved, or the checkout is not what this check assumes."
          fi

          VERSION="$(node -p "require('./$MANIFEST').version || ''" 2>/dev/null || true)"
          case "$VERSION" in
            ''|undefined|null)
              finish blind "could not read a version out of $MANIFEST."
              ;;
          esac
          log "main declares:    $VERSION"

          # ── 2. can we even ask? ──────────────────────────────────────────
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            finish blind "secrets.GITHUB_TOKEN is empty, so the registry cannot be read at all."
          fi

          if [ ! -f "$GUARD" ]; then
            finish blind "$GUARD does not exist on this ref. That script is the ONE registry probe, and this check will not hand-roll a second one to get around its absence."
          fi

          # ── 3. ask the ONE probe ─────────────────────────────────────────
          # `inspect` writes key=value on stdout and the cause of a failure on
          # stderr. It exits 2 for every packument it cannot trust — a refused
          # token, a 5xx, a transport failure, a 405, and a 200 whose body is
          # not a packument. All of those are BLIND here.
          #
          # 🐞 `set +e` IS LOAD-BEARING. GitHub runs this step under
          # `bash -e {0}`, so an inherited exit 2 kills the step BEFORE `finish`
          # can write the report and the `::error::` line. The verdict still
          # came out BLIND — the issue step reads a missing verdict as blind on
          # purpose — but the alert lost every word of WHY, which is the only
          # part a human can act on. Measured on run 33082240072.
          set +e
          PROBE="$(bash "$GUARD" inspect "$VERSION" 2>"$PROBE_ERR")"
          PROBE_RC=$?
          set -e

          field() { printf '%s\n' "$PROBE" | sed -n "s/^$1=//p" | head -n 1; }

          CODE="$(field packument_http)"
          log "packument http:   ${CODE:-(none)}"

          if [ "$PROBE_RC" -ne 0 ]; then
            WHY="$(head -c 400 "$PROBE_ERR" 2>/dev/null || true)"
            case "${CODE:-000}" in
              401|403)
                finish blind "the registry refused the token (http $CODE). GITHUB_TOKEN needs 'packages: read', and $PKG must still grant this repository read access. $WHY"
                ;;
              000)
                finish blind "the request to the registry did not complete — curl reported a transport failure. $WHY"
                ;;
              *)
                finish blind "the registry could not be read, or answered with a body the probe refuses to trust. An unreadable registry must not be read as agreement. $WHY"
                ;;
            esac
          fi

          LATEST="$(field latest)"
          IS_PUBLISHED="$(field already_published)"
          VERSIONS="$(field versions)"

          # 404 is the one status the probe trusts but this monitor hates: the
          # registry ANSWERED, and the answer is that nothing lives here.
          if [ "$CODE" = "404" ]; then
            finish drift "the registry holds NO package named $PKG, while main declares $VERSION. Nothing was ever published under this name, or the package was deleted."
          fi

          # A packument the probe can read can still be one this monitor cannot
          # use. "Can I read it?" is the probe's question; "is this an answer to
          # MY question?" is this file's.
          if [ -z "$LATEST" ]; then
            finish blind "the packument has no dist-tags.latest, so there is nothing to compare $VERSION against."
          fi
          if [ -z "$VERSIONS" ]; then
            finish blind "the packument tags $LATEST as 'latest' but lists no published versions at all. That document contradicts itself, and a self-contradicting body must not be read as agreement."
          fi

          log "registry latest:  $LATEST"
          log "registry has:     $VERSIONS"
          log ""

          # ── 4. the verdict ───────────────────────────────────────────────
          if [ "$LATEST" = "$VERSION" ]; then
            log "The registry serves exactly the version main declares."
            finish clean
          fi

          # `already_published` is an exact key lookup in the `versions` map,
          # done by the probe. It is not a substring test: `1.0.0-rc.1` is not
          # `1.0.0`, and `constructor` is not a published version.
          if [ "$IS_PUBLISHED" = "yes" ]; then
            finish drift "main declares $VERSION and $VERSION IS published, but the registry still tags $LATEST as 'latest' for $PKG. A dist-tag is pointing at the wrong version — someone published out of order, or moved the tag by hand."
          fi

          finish drift "main declares $VERSION but the registry serves $LATEST as 'latest' for $PKG, and $VERSION was never published. A version bump merged and no publish ran: check the 'release-activities' workflow — a reverted push trigger, a drifted path filter, a runner outage, or a failed run nobody read."

      - name: Open, update or close the drift issue
        if: always()
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
          REPORT_FILE: ${{ runner.temp }}/registry-drift-report.txt
          GH_TOKEN: ${{ github.token }}
          TITLE: '[registry-drift] @iterahq/activities: main and the registry disagree'
          IS_CANONICAL: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -u

          REPORT="$(cat "$REPORT_FILE" 2>/dev/null || echo '(no report — the check died before it wrote one)')"
          # An absent verdict means the check step never reached a conclusion.
          # The safe reading of "no answer" is BLIND, never CLEAN.
          VERDICT="${VERDICT:-blind}"
          echo "verdict=$VERDICT canonical=$IS_CANONICAL"

          if [ "$IS_CANONICAL" != "true" ]; then
            {
              echo "### registry-drift: $VERDICT (ref \`$GITHUB_REF_NAME\`)"
              echo ""
              echo "Not the default branch, so no issue was opened, updated or closed."
              echo ""
              printf '```\n%s\n```\n' "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$VERDICT" = "clean" ] && exit 0
            exit 1
          fi

          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1 || true)"

          if [ "$VERDICT" = "clean" ]; then
            printf ':white_check_mark: no drift.\n\n```\n%s\n```\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "Drift cleared — \`main\` and the registry agree again as of run ${GITHUB_RUN_ID}."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          if [ "$VERDICT" = "blind" ]; then
            HEADLINE='The daily registry check could NOT TELL whether `main` and the registry agree. That is a failure, not an all-clear — treat this repo as unmonitored until it is fixed.'
            GUIDANCE='- **http 401 / 403** — the run token cannot read the package. Check `permissions.packages: read` in `.github/workflows/registry-drift.yml`, and that `@iterahq/activities` still grants this repository read access.
          - **http 5xx / transport** — GitHub Packages was unreachable. If it clears on the next run, nothing else is needed.
          - **manifest / packument did not parse** — the shape this check assumes changed. Fix the check; do not silence it.'
          else
            HEADLINE='The daily registry check found that `main` and the registry DISAGREE about `@iterahq/activities`.'
            GUIDANCE='- **the version on `main` was never published** — a bump merged and no publish ran. Look at the `release-activities` workflow: a reverted `push` trigger, a drifted `paths:` filter, a runner outage, or a red run nobody read. Re-run it with `workflow_dispatch` once the cause is understood.
          - **the version IS published but is not `latest`** — a dist-tag points at the wrong version. Someone published out of order or moved the tag by hand.
          - **the registry has no such package** — nothing was ever published under this name, or it was deleted.

          This is the 17-day failure of 2026-08-17 happening again. It is silent for consumers: `npm install` keeps working and hands them the wrong version.'
          fi

          BODY="$(printf '%s\n\n```\n%s\n```\n\nWhat to do:\n\n%s\n\n_run: %s/%s/actions/runs/%s_\n' \
            "$HEADLINE" "$REPORT" "$GUIDANCE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug
          fi

          # Loud in both places: an open issue AND a red run.
          exit 1
