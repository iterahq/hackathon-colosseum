name: Image (Build, Push to GHCR, Deploy)

# CI-image-build path (plan 20260527-dokploy-vps-oom-prevention, T10 / ADR-7; Q f5bcbeab = A).
# CI builds the image and pushes ghcr.io/iterahq/hackathon-colosseum-web. The Dokploy app
# `hackathon-colosseum-web` is sourceType=docker and only PULLS it, so no `docker build` runs on
# dokploy-vps. Runbook: dfl-infra:vps/dokploy-vps/_tools/CI-IMAGE-BUILD.md.
# Tags: `latest` (Dokploy pulls) + the full commit SHA (rollback pin).
# Rollback: dokploy-deploy `set-source-type hackathon-colosseum-web github` (host build), or set-docker-source with :<old-sha>.
# Build args are public values (VITE_* and NEXT_PUBLIC_* are inlined in the bundle) kept in repo secrets of the same name.
# Real secrets go to BuildKit `secrets:` only. A pull_request run builds without push and without deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'docker/**'
      - '.github/workflows/image-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One image build + deploy at a time on the branch; never cancel a deploy mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build-and-push:
    name: Build image (push on main)
    runs-on: [self-hosted, dfl-runner]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iterahq/hackathon-colosseum-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long

      - name: Build (push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: false
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_OTEL_ENABLED=${{ secrets.VITE_OTEL_ENABLED }}
            VITE_ITERA_API_BASE=${{ secrets.VITE_ITERA_API_BASE }}
            VITE_ITERA_API_URL=${{ secrets.VITE_ITERA_API_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
            GIT_SHA=${{ github.sha }}
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hackathon-colosseum-web
          cache-to: type=gha,mode=max,scope=hackathon-colosseum-web

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image ghcr.io/iterahq/hackathon-colosseum-web:${GITHUB_SHA} digest ${DIGEST}"
          echo "| hackathon-colosseum-web | \`${GITHUB_SHA}\` | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger Dokploy deploy (pull only)
    needs: [build-and-push]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dfl-runner]
    env:
      DOKPLOY_DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: POST the Dokploy deploy webhook (one call, no retry)
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK_URL" ]; then
            echo "::notice::DOKPLOY_DEPLOY_WEBHOOK_URL is not set: image pushed, deploy skipped."
            exit 0
          fi
          body=$(printf '{"ref":"%s","head_commit":{"message":"ci image %s"}}' "$GITHUB_REF" "$GITHUB_SHA")
          curl -sS -f --max-time 60 -o /dev/null -w 'dokploy webhook HTTP %{http_code}\n' -X POST "$DOKPLOY_DEPLOY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -d "$body"
