name: DB Apply

# ──────────────────────────────────────────────────────────────────────────────
# MERGING A MIGRATION NOW APPLIES IT.
#
# Until 2026-08-04 it did not. `db/README.md` said so in as many words — "a human
# or agent has to run the script below, by hand, after the merge. If nobody does,
# `main` and the database silently disagree." Nobody did: 0036, 0037 and 0038 sat
# merged-and-unapplied for days, so every live attempt in that window was written
# without the stage-cursor topic, without `spec_snapshot`/`spec_locale` and
# without `pedagogical_context`. Those rows cannot be back-filled — the wording
# and the tagging of the moment are simply gone. Tainan, TG 2026-08-04:
# *"isso n pode acontecer. faz isso virar automação bro"*.
#
# PRECEDENT: this mirrors devfellowship/dfl-schema `.github/workflows/
# push-migrations.yml` — the human MERGE is the gate, CI does the applying, psql
# goes through the pooler, the ledger decides what is pending, ON_ERROR_STOP is
# on, and a failure fails the job. Same shape, same guards. It is deliberately
# NOT a new pattern.
#
# THREE DIFFERENCES FROM dfl-schema, EACH ON PURPOSE:
#
#  1. TRIGGER IS `push` TO main, NOT `pull_request: closed`. dfl-schema uses the
#     PR-closed event so it can comment on the PR. `push` is a superset: it also
#     catches a direct push to main, which is a real way for a migration to
#     arrive and which the PR trigger silently misses. The PR comment is still
#     posted — the PR number is recovered from the squash-merge subject.
#
#  2. STOPS AT THE FIRST FAILURE. dfl-schema keeps going and reports a count.
#     Migration order is meaningful, so applying 0038 after 0037 failed is how a
#     half-migrated schema turns into a mystery.
#
#  3. NO `continue-on-error`, ANYWHERE, INCLUDING THE COMMENT STEP. A check that
#     passes by not looking is worse than no check.
#
# RUNNER: `[self-hosted, dfl-runner]` — the iterahq-scoped runner registrations,
# same labels every other workflow in this repo uses. See the header of ci.yml
# for why iterahq has its own runners on the same hosts.
#
# CREDENTIAL: `secrets.SUPABASE_DB_PASSWORD` — a REPO secret on
# iterahq/itera-player, not an org secret. An org secret is readable by every
# workflow of every private repo in the org; this password is needed by exactly
# one workflow file in exactly one repo. Canonical value lives in Infisical at
# `/apps/itera` key `SUPABASE_DB_PASSWORD`; the GitHub secret is a propagation of
# it and is a rotation destination — see
# dfl-infra:vps/_tools/rotate-itera-db-password.sh.
#
# Plan: 20260728-itera-migration-ci-lock (Fase 3).
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'db/scripts/apply-migrations.sh'
      - '.github/workflows/db-apply.yml'
  workflow_dispatch:

# Never cancel a run that is halfway through applying DDL to production.
concurrency:
  group: db-apply
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  apply:
    name: apply pending migrations
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Verify DB connection
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${PGPASSWORD}" ]; then
            echo "::error::secrets.SUPABASE_DB_PASSWORD is empty. Nothing was applied."
            echo "Set it with: gh secret set SUPABASE_DB_PASSWORD --repo iterahq/itera-player"
            echo "Value: Infisical /apps/itera SUPABASE_DB_PASSWORD (never paste it into a log, PR or ticket)."
            exit 1
          fi
          psql "postgresql://postgres.kjefmwlopzeaqgqtlbdn@aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            -qtAX -c "select 'db connection ok';"

      - name: Apply pending migrations
        id: apply
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPLIED_BY: ci:${{ github.run_id }}
          REPORT_FILE: ${{ runner.temp }}/db-apply-report.txt
        run: |
          : > "$REPORT_FILE"
          bash db/scripts/apply-migrations.sh apply

      - name: Report
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/db-apply-report.txt
          OUTCOME: ${{ steps.apply.outcome }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -u
          if [ "$OUTCOME" = "success" ]; then
            HEADER=":white_check_mark: **DB Apply — migrations applied to the Itera database**"
          else
            HEADER=":x: **DB Apply — FAILED. The database may be behind \`main\`.**"
          fi

          BODY="$(printf '%s\n\n```\n%s\n```\n\n_run: %s/%s/actions/runs/%s_\n' \
            "$HEADER" \
            "$(cat "$REPORT_FILE" 2>/dev/null || echo '(no report — the run failed before the apply step)')" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

          # Squash merges end the subject with "(#NNN)". No PR number (direct
          # push, or workflow_dispatch) simply means no comment — the step
          # summary and the job status still carry the result.
          PR="$(printf '%s' "$COMMIT_MSG" | head -1 | sed -n 's/.*(#\([0-9]\{1,\}\)).*/\1/p')"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body "$BODY" || echo "::warning::could not comment on PR #$PR"
          else
            echo "no PR number in the head commit subject — skipping the PR comment"
          fi

          # The job's verdict is the apply step's verdict. Nothing here softens it.
          [ "$OUTCOME" = "success" ] || exit 1
