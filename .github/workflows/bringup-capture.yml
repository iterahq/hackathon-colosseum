name: Bring-up capture (disposable ITERA stack)

# Stands up `bringup/` — Postgres + GoTrue + PostgREST on loopback, `itera.*`
# built from db/migrations by the repository's own applier — and photographs `/`
# plus three authenticated routes, twice, asserting the two sets of bytes match.
#
# 🚫 NOT A PER-PR GATE, AND THAT IS DELIBERATE.
# ADR-3 of plan 20260728-itera-activity-testing is binding for this repository:
# Playwright stays OUT of `ci.yml`. This run also builds the app twice and
# applies 64 migrations, so it costs minutes that a per-PR gate would pay on
# every push. It runs on demand and weekly, like `e2e.yml`.
#
# ⚠️ WHAT A RED RUN MEANS HERE, because it is not the usual thing.
# The three assertions fail for three different reasons and the distinction
# matters more than the colour:
#   * "the three identities carry three different roles" — the claim hook is not
#     firing, or the auto-provisioned `plg-*` owner membership was not stripped.
#     Every OTHER test still passes in that state, which is why this one exists.
#   * "<screen> renders and maps" with a settled-path failure — `RequireRole`
#     redirected instead of refusing. The screen was NOT captured; a naive
#     harness would have filed the home page under an admin route.
#   * "<screen> captured twice is byte-identical" — something non-deterministic
#     reached a pixel. Until it is found, no downstream version diff can tell
#     "the product changed" from "the capture wobbled".
#
# Runner: self-hosted `dfl-runner`, per CLAUDE.md — and this repo is PRIVATE, so
# GitHub-hosted minutes would be billable against the iterahq allowance (it hit
# 2000/2000 on 2026-07-29). See the header of `e2e.yml` for that history.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 05:20 UTC. Off the hour, so it does not queue behind every
    # other cron on the shared runner fleet.
    - cron: '20 5 * * 1'

permissions:
  contents: read
  # `@iterahq/activity-spec` lives on npm.pkg.github.com. The NATIVE workflow
  # token reads it — no PAT is needed inside this repo's own workflows, which is
  # what every other job here already relies on.
  packages: read

concurrency:
  # The stack binds fixed loopback ports, so two of these on one runner host
  # would fight over 54329/54330/54331. Serialise rather than randomise: fixed
  # ports are what make `bringup/env.sh` the single source for them.
  group: bringup-capture
  cancel-in-progress: false

jobs:
  capture:
    name: authenticated screens, captured twice
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Fail here, naming the missing tool, rather than 200 lines later inside
      # compose. `up.sh` makes the same checks; this one keeps the failure at
      # the top of the log.
      - name: Preflight — docker compose and psql
        run: |
          set -euo pipefail
          docker compose version
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install chromium
        run: npm run e2e:install

      - name: Stand the stack up
        run: bash bringup/up.sh

      - name: Capture and assert
        run: npm run e2e:bringup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `always()`: a failed run is exactly when somebody needs to look at the
      # pixels. The artifact is short-lived on purpose — the durable home for a
      # capture is media.devfellowship.com with a media id recorded in
      # `engineering.ux_map_*`, which is DFL-0069E's job, not this workflow's.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bringup-capture
          path: e2e/artifacts/bringup/
          retention-days: 7
          if-no-files-found: warn

      # `if: always()` and NOT only on success: a stack left running holds the
      # loopback ports and its Postgres volume, and the next run would then find
      # a database that is not empty — turning "build from zero" into "build
      # from whatever the last failure left".
      - name: Destroy the stack
        if: always()
        run: bash bringup/down.sh
