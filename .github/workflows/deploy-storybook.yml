name: Deploy Storybook

# Builds the static Storybook and deploys it to the Cloudflare Pages project
# `itera-storybook` (served at https://storybook.iterahq.dev) on every push to main.
# Closes the deploy-hygiene gap where storybook.iterahq.dev had no auto-deploy.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects Storybook changes.
    # `design-playground/**` está aqui porque `.storybook/main.ts` monta o site a partir
    # dela também. Sem essa entrada, PR que mexe SÓ no playground mergeia sem republicar:
    # o site fica na versão antiga até alguém tocar `src/` por outro motivo.
    paths:
      - 'src/**'
      - 'design-playground/**'
      - '.storybook/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch: {}

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29). iterahq is on
    # the GitHub free plan and exhausted its 2000 included GitHub-hosted Actions
    # minutes — every run org-wide failed in ~3s with no runner assigned. iterahq
    # now has its OWN org-scoped runners on the two dfl-runner VPSes (separate
    # registrations from devfellowship's; same `self-hosted,dfl-runner` labels).
    # Safe: this repo is PRIVATE, so the fork-PR hazard that bans self-hosted on
    # public repos does not apply. Full rationale in ci.yml.
    runs-on: [self-hosted, dfl-runner]
    permissions:
      contents: read
      # `@iterahq/activity-spec` now resolves from GitHub Packages instead of a
      # vendored `.tgz`, so this job needs registry read like every other
      # install site. It was the ONE `setup-node` block #274 left unwired,
      # because back then nothing under the `@iterahq` scope actually had to be
      # fetched (the spec was a `file:` tarball, `activities` is a workspace).
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history — the Design Playground "send order"
          # (`scripts/storybook-playground-order.ts`, read by
          # `scripts/storybook-playground-indexer.ts` at index time) runs
          # `git log --diff-filter=A -1` per `design-playground/**` story
          # file to find the commit that ADDED it. The default shallow
          # checkout (`fetch-depth: 1`) would leave that lookup with no
          # record for anything but the very last commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=itera-storybook --branch=main
