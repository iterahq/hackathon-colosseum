name: Deploy Storybook

# Builds the static Storybook and deploys it to the Cloudflare Pages project
# `itera-storybook` (served at https://storybook.iterahq.dev) on every push to main.
# Closes the deploy-hygiene gap where storybook.iterahq.dev had no auto-deploy.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects Storybook changes.
    paths:
      - 'src/**'
      - '.storybook/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch: {}

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29). iterahq is on
    # the GitHub free plan and exhausted its 2000 included GitHub-hosted Actions
    # minutes — every run org-wide failed in ~3s with no runner assigned. iterahq
    # now has its OWN org-scoped runners on the two dfl-runner VPSes (separate
    # registrations from devfellowship's; same `self-hosted,dfl-runner` labels).
    # Safe: this repo is PRIVATE, so the fork-PR hazard that bans self-hosted on
    # public repos does not apply. Full rationale in ci.yml.
    runs-on: [self-hosted, dfl-runner]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=itera-storybook --branch=main
