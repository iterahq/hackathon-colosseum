name: CI

# ──────────────────────────────────────────────────────────────────────────────
# RUNNER: self-hosted `dfl-runner` fleet — NOT ubuntu-latest (changed 2026-07-29)
#
# WHY: the `iterahq` org is on the GitHub FREE plan and exhausted its 2000
# included GitHub-hosted Actions minutes (2000/2000, no overage allowance). From
# that moment EVERY workflow run across the whole org failed in ~3 seconds with
# no runner assigned and zero steps executed — CI was not red, it was absent.
# Rather than enable paid Actions billing, iterahq now uses the two runner VPSes
# we already own.
#
# HOW: a GitHub runner registration belongs to exactly ONE scope, and free orgs
# cannot use enterprise-level shared runner groups — so the existing
# `devfellowship` registrations CANNOT be shared. We registered SEPARATE
# iterahq-scoped runner processes co-located on the same two hosts (2 per host,
# 4 total: `itera-runner-1/2` + `itera-runner-02-1/2`), carrying the same
# `self-hosted,dfl-runner` labels. Because labels are scoped per org, an iterahq
# job can only ever land on an iterahq-registered runner — there is no
# cross-org routing. Self-hosted minutes are free and unmetered.
#
# WHY IT IS SAFE HERE: `itera-player` is a PRIVATE repo
# (`gh api repos/iterahq/itera-player --jq .private` -> true), so the fork-PR RCE
# hazard that bans self-hosted runners on PUBLIC repos does not apply. The
# iterahq runner group keeps `allows_public=false`.
#
# NOTE: an earlier version of this header claimed org-scoped runners "aren't
# available to other orgs, so jobs would queue forever". That was true only of
# the devfellowship registrations; it was never a reason iterahq could not have
# runners of its own.
#
# Infra is versioned at devfellowship/dfl-infra:vps/dfl-runner/
# (docker-compose.iterahq*.yml, install-iterahq.sh, README "iterahq org runners").
# ──────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # See the runner rationale at the top of this file (iterahq free-plan
    # Actions-minutes exhaustion -> our own iterahq-scoped dfl-runners).
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      # `npm run build` is `vite build`, which TRANSPILES without type-checking —
      # so a type error could reach main invisibly (that is exactly how two
      # latent TS2554s shipped in #191 before #193 caught them). This step is the
      # gate: it fails the build on any type error.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ────────────────────────────────────────────────────────────────────
      # THE TAILWIND GLOB IS LOAD-BEARING, AND ITS FAILURE IS SILENT
      #
      # Fase C moved the activity renderers into `packages/activities`, which
      # is OUTSIDE `./src`. Tailwind only emits utilities it finds in its
      # `content` globs, and the app resolves the package through the workspace
      # symlink to `dist/` — so `./packages/*/dist/**/*.js` in
      # `tailwind.config.ts` is the only reason the extracted kinds have any
      # styling at all.
      #
      # Drop that glob and NOTHING FAILS: `npm run build` is green, every test
      # is green, the app boots, and the activities render correct, interactive
      # and unstyled. Measured on 2026-08-07 — removing the glob took
      # `cursor-zoom-in` (used only by the extracted `InstructionImage`) from
      # present to absent in the emitted CSS, with a clean build either way.
      #
      # So the assertion is on the ARTIFACT. Two classes, chosen because each
      # appears in exactly one extracted file and nowhere in `src/`:
      #   • `cursor-zoom-in`  -> packages/activities components/InstructionImage
      #   • `marker:text-evergreen` -> packages/activities components/RichBlock
      # If a future refactor makes one of them appear in `src/` too, this check
      # goes quiet without going red — pick a different class then, do not
      # delete the step.
      # ────────────────────────────────────────────────────────────────────
      - name: The extracted renderers' Tailwind classes survived the purge
        run: |
          set -euo pipefail
          CSS="$(ls dist/assets/*.css | head -1)"
          test -n "$CSS" || { echo "::error::no built CSS to check"; exit 1; }
          # `grep -qF`: Tailwind escapes the variant colon, so the emitted
          # selector is `.marker\:text-evergreen` with a LITERAL backslash — a
          # basic-regex pattern eats it and reports a false purge.
          for CLASS in 'cursor-zoom-in' 'marker\:text-evergreen'; do
            if ! grep -qF -- "$CLASS" "$CSS"; then
              echo "::error::'$CLASS' was purged from $CSS - packages/*/dist is missing from tailwind.config.ts content globs, and every extracted activity is now unstyled"
              exit 1
            fi
          done
          echo "ok: the packages/*/dist content glob is doing its job"

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # DOC DRIFT GATE (2026-07-31)
  #
  # `scripts/verify-docs.sh` shipped in this repo's foundation commit and NO
  # workflow ever called it — `grep -rn verify-docs .github/` returned nothing.
  # Meanwhile CLAUDE.md and repo-contract.yaml drifted far enough that agents
  # were being pointed at a deleted directory (`src/components/activity/`) and a
  # retired entrypoint (`src/pages/LessonPage.tsx`). The checker would have
  # caught both on day one. It is wired now, and it BLOCKS.
  #
  # It is blocking rather than advisory because, once its two false-positive
  # classes were fixed (qualified cross-repo paths, gitignored build output), a
  # full run over all four docs is CLEAN — so it costs nothing until something
  # actually drifts. An advisory gate is how it got ignored for a year.
  #
  # Separate job, and NO `npm install`: the checker is pure bash + git + node, so
  # it returns in seconds and does not eat into the `build-test` wall-clock
  # budget that the browser-mode promotion decision (see below) is measured
  # against. `setup-node` is still needed — step 4 of the checker asserts that
  # the tools named in the docs' setup commands actually exist, and the bare
  # self-hosted runner has no `npm` on PATH without it. (That check earned its
  # keep on the very first run by catching exactly this.)
  # ──────────────────────────────────────────────────────────────────────────
  docs-drift:
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify docs match the code
        run: bash scripts/verify-docs.sh

  # ──────────────────────────────────────────────────────────────────────────
  # ACTIVITY CHARACTERIZATION BASELINE — BLOQUEANTE (sub-plano 0 de
  # `20260731-itera-eventos-aprendizagem`, Q4 respondida "entra no gate de PR").
  #
  # POR QUE AQUI E NÃO NO `e2e.yml`
  #
  # O `e2e.yml` é `workflow_dispatch` + cron diário, roda contra prod ao vivo
  # (learn + api + app), e é capability-gated: dependência ausente vira SKIP. Ele
  # responde "prod está costurado?". Esta suíte responde uma pergunta diferente e
  # incompatível com aquele contrato: "o comportamento das atividades mudou neste
  # PR?". Ela precisa (a) travar merge, (b) rodar contra o CÓDIGO DO PR e não
  # contra o deploy, (c) nunca pular. Enfiá-la no `e2e.yml` herdaria as três
  # propriedades erradas — e arrastaria a suíte cara de prod pro gate junto.
  #
  # ZERO SEGREDOS — E ISSO É REQUISITO, NÃO CONVENIÊNCIA
  #
  # `iterahq/itera-player` tem exatamente DOIS Actions secrets (`CLOUDFLARE_*`) —
  # verificado 2026-07-31. `ITERA_SMOKE_*` e `VITE_SUPABASE_*` NÃO existem, que é
  # exatamente por que o `e2e.yml` vive vermelho/vazio. Um gate bloqueante que
  # depende de credencial não provisionada é um gate bloqueante sempre vermelho.
  # Por isso a suíte builda com uma origem Supabase STUB
  # (`http://stub.supabase.invalid`, TLD reservado, jamais resolve) e intercepta
  # tudo no Playwright. Ver `e2e/support/harnessStub.ts`.
  #
  # ORÇAMENTO (V3 do plano: < 10 min)
  #
  # Medido em 2026-07-31 na openclaw-tainan: 48 cenários, **45s** de ponta a
  # ponta INCLUINDO o `vite build`. O `timeout-minutes: 15` é folga pro runner
  # self-hosted, não expectativa. Se um dia passar de 10 min, CORTE cenário e
  # diga o que cortou — truncar em silêncio é pior que cobrir menos.
  #
  # Job separado do `build-test` de propósito: o custo do navegador fica isolado
  # no wall-clock, do mesmo jeito que o `browser-mode` (ver abaixo).
  # ──────────────────────────────────────────────────────────────────────────
  activity-baseline:
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ `node node_modules/playwright/cli.js`, NÃO `npx playwright`: o `npx`
      # resolve pelo cache dele e pode instalar uma revisão de Chromium DIFERENTE
      # da que o `@playwright/test` do lock exige — aí o teste roda com um browser
      # que não existe e falha com "Executable doesn't exist". Queimado 2026-07-31.
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      # O `webServer` da config faz o `vite build` + `vite preview` com a origem
      # Supabase stub. Nada de rede externa, nada de login, nada de DB.
      - name: Activity characterization baseline
        run: npm run e2e:baseline

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-baseline-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # BROWSER MODE (ADR-8) — NÃO-BLOQUEANTE POR UMA SEMANA (ADR-9).
  #
  # Plano `20260728-itera-activity-testing`. A Q2 foi respondida "A": o tier
  # novo entra reportando e NÃO travando merge, e só vira gate depois de uma
  # semana estável, se o delta couber no orçamento medido.
  #
  # `continue-on-error: true` é o que torna essa promessa verificável em vez de
  # declarada. NÃO REMOVER sem a decisão de promoção — e, quando ela vier, ela
  # tem que citar o número medido, não a intenção.
  #
  #   Observação começa em: 2026-07-28
  #   Revisão de promoção  : 2026-08-04
  #   Orçamento da Fase 0  : o `build-test` bloqueante não deve passar de ~4m30s.
  #     ⚠️ Aquele teto foi ancorado numa mediana de 3m01s que hoje está OBSOLETA
  #     (o `build-test` já roda ~3m40s desde que o typecheck virou gate e a
  #     suíte cresceu). A folga real é de ~50s, e é contra ESSE número que a
  #     promoção tem que ser decidida.
  #
  # ⚠️ LEIA ANTES DA REVISÃO DE 2026-08-04. Até 2026-08-03 este job NUNCA foi
  # verde — nem uma vez, nem na `main`. Ele saía `exit 1` com duas unhandled
  # rejections, com os 3 testes PASSANDO: o `vitest.browser.config.ts` não
  # carregava o plugin que vendoriza o Monaco, então `/vendor/monaco/vs/loader.js`
  # dava 404 e o `@monaco-editor/loader` rejeitava. Era falha de HARNESS, não de
  # produto, e o `continue-on-error` a manteve invisível por uma semana inteira.
  # Duas leituras para a decisão de promoção:
  #   1. A semana de observação NÃO produziu o dado que o ADR-9 pede — o que foi
  #      observado foi um job quebrado. O relógio de estabilidade recomeça agora.
  #   2. Um job não-bloqueante permanentemente vermelho é caro de outro jeito:
  #      ele deixa um context VERMELHO no `statusCheckRollup` de todo PR, o que
  #      trava o `safe-admin-merge` (que exige TODOS os contexts verdes).
  # A recomendação registrada na Fase 3 do plano segue de pé por um motivo
  # independente e não resolvido aqui: o custo dominante é o
  # `playwright install --with-deps chromium` (1–2 min) contra ~50s de folga.
  # Cachear `~/.cache/ms-playwright` e MEDIR antes de promover.
  #
  # Ele roda como JOB SEPARADO de propósito: assim o custo do navegador aparece
  # isolado no wall-clock, que é exatamente o dado que a decisão de promoção
  # precisa. Misturá-lo no `build-test` esconderia a única medida que importa.
  # ──────────────────────────────────────────────────────────────────────────
  browser-mode:
    # Mesmo runner do `build-test`: os dfl-runners próprios do iterahq (ver o
    # cabeçalho deste arquivo). O job é `continue-on-error: true`, então mesmo
    # que o `playwright install --with-deps` tropece no host self-hosted ele
    # não trava merge — o que preserva a promessa do ADR-9 durante a migração.
    runs-on: [self-hosted, dfl-runner]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Só o Chromium: as instâncias do projeto de browser declaram apenas ele.
      - name: Install Chromium for the Vitest browser provider
        run: npx playwright install --with-deps chromium

      # `npm run test:browser` usa `vitest.browser.config.ts`, que seleciona
      # SOMENTE as stories com a tag `browser-mode` (hoje: match e code).
      - name: Storybook browser-mode tests
        run: npm run test:browser

  # ──────────────────────────────────────────────────────────────────────────
  # EXTERNAL CONSUMER GATE (2026-08-07, Fase C)
  #
  # Fase C moved the activity renderers into `@iterahq/activities`. The claim
  # that makes the plan worth executing is "an activity can be rendered by an
  # app that is NOT the Itera Player", and NOTHING in the other jobs tests it:
  # `build-test` compiles the package next to the app that came from it, with
  # the app's resolver, the app's React, the app's tsconfig and 625 hoisted
  # packages on disk. Every one of those is a condition an outside app does not
  # have, so a green there is compatible with a package nobody else can install.
  # The Fase B contract test had exactly that shape and proved nothing about
  # external use.
  #
  # WHAT THIS RUNS: `npm pack` on the workspace, then installs THAT tarball
  # (`--install-links`, so nothing symlinks back) into `external-consumer/`,
  # which has its own `node_modules`, no bundler, no TypeScript and no Itera
  # anything. It then renders the seven extracted kinds from fixture specs in
  # jsdom, answers one, and asserts the verdict, the telemetry, the absence of
  # player chrome and — with `fetch` rigged to throw — the absence of any
  # backend call. See `external-consumer/README.md`.
  #
  # WHY IT IS BLOCKING: an extraction whose portability is not checked stops
  # being portable on the first PR that adds an `@/` import to a package file.
  # Nothing else in this repo would go red for that.
  #
  # Separate job on purpose, same reason as `activity-baseline`: the cost of a
  # from-scratch install shows up isolated in the wall-clock instead of hiding
  # inside `build-test`. No secrets — the harness installs from a tarball and
  # its `.npmrc` disables peer auto-install, so it needs no registry read.
  # ──────────────────────────────────────────────────────────────────────────
  external-consumer:
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      # Only the workspace package is needed to pack it, but the build script
      # lives behind the root install (typescript is a devDependency there).
      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render activities outside the Itera Player
        run: npm run external-consumer

  # ──────────────────────────────────────────────────────────────────────────
  # REGISTRY RESOLUTION GATE (2026-08-04) — o tarball vendorizado não volta
  #
  # `@iterahq/activity-spec` deixou de ser `file:vendor/*.tgz` e passou a
  # resolver do GitHub Packages. Dois modos de falha precisam ficar fechados, e
  # nenhum dos dois é pego pelos outros jobs:
  #
  # 1. **Regressão pro `file:`.** Um `npm install` local com o tarball na mão
  #    reescreve o lock de volta pra `file:` sem barulho. O `build-test` roda
  #    `npm install`, que ACEITA lock fora de sintonia — então ele nunca
  #    reclamaria. Aqui o grep é explícito e bloqueia.
  #
  # 2. **Resolução falsa-positiva por CACHE.** `npm ci` num runner self-hosted
  #    pode servir o pacote do `~/.npm` de uma execução anterior e passar mesmo
  #    se o registry estivesse inacessível — exatamente o tipo de verde que
  #    esconde o `403 read_package`. Por isso este job usa um diretório de cache
  #    VAZIO (`--cache "$RUNNER_TEMP/npm-cache-$GITHUB_RUN_ID"`) e `npm ci`
  #    (que apaga `node_modules` antes de instalar). Sem tarball no repo e sem
  #    cache quente, a ÚNICA origem possível é a rede.
  #
  # Este é o job que prova o exit criterion da Fase B do plano
  # `20260803-itera-player-activities-lib` ("zero `file:vendor/*.tgz`"), e o
  # item 10 da Verification ("acesso de leitura cross-repo é verificável e DEVE
  # ser verificado") — a leitura cross-repo só funciona porque um owner da org
  # deu Actions access de `@iterahq/activity-spec` a este repo. Se o grant for
  # revogado, este job fica vermelho com o `403` na cara em vez de o problema
  # aparecer semanas depois no deploy.
  # ──────────────────────────────────────────────────────────────────────────
  registry-resolution:
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: No vendored tarball may come back
        run: |
          set -euo pipefail
          if grep -n 'file:vendor/' package.json package-lock.json; then
            echo "::error::a file:vendor/*.tgz dependency is back - see packages/activities/CONTRACT.md"
            exit 1
          fi
          if compgen -G 'vendor/*.tgz' > /dev/null; then
            echo "::error::vendor/*.tgz exists again"
            exit 1
          fi
          echo "clean: no file: dependency, no vendored tarball"

      - name: Clean install with an EMPTY npm cache
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/npm-cache-$GITHUB_RUN_ID"
          rm -rf node_modules "$CACHE"
          mkdir -p "$CACHE"
          # Assert the premise of the next step before relying on it.
          test -z "$(ls -A "$CACHE")" || { echo "::error::cache dir not empty"; exit 1; }
          npm ci --cache "$CACHE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE for whoever edits this: do NOT try to prove the fetch by grepping
      # cacache's `index-v5` for the registry URL. `npm ci` takes `resolved` and
      # `integrity` straight from the lockfile and never requests a packument,
      # so no URL-keyed index entry is ever written and the grep finds nothing
      # even on a perfectly good install. Burned 2026-08-04. The tarball itself
      # IS written, content-addressed — that is what this step checks.
      - name: Prove the package came over the network from GitHub Packages
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/npm-cache-$GITHUB_RUN_ID" node -e '
            const fs = require("fs"), path = require("path");
            const lock = require("./package-lock.json");
            const key = "node_modules/@iterahq/activity-spec";
            const e = lock.packages[key];
            if (!e) throw new Error(key + " missing from package-lock.json");
            if (!/^https:\/\/npm\.pkg\.github\.com\//.test(e.resolved || ""))
              throw new Error("resolved is not GitHub Packages: " + e.resolved);
            if (!e.integrity) throw new Error("no integrity hash - not a registry resolution");
            const installed = require("./node_modules/@iterahq/activity-spec/package.json");
            if (installed.version !== e.version)
              throw new Error("installed " + installed.version + " != locked " + e.version);

            // cacache lays fetched content out at
            //   <cache>/_cacache/content-v2/<algo>/<hex0:2>/<hex2:4>/<hex4:>
            // keyed by the hex form of the integrity digest. That cache
            // directory was EMPTY at the start of the previous step and there
            // is no tarball in the repo, so the blob being there now means it
            // was downloaded from the registry during this run - not served
            // from a warm cache, and not read off disk.
            const [algo, b64] = e.integrity.split("-");
            const hex = Buffer.from(b64, "base64").toString("hex");
            const blob = path.join(process.env.CACHE, "_cacache", "content-v2",
                                   algo, hex.slice(0, 2), hex.slice(2, 4), hex.slice(4));
            if (!fs.existsSync(blob))
              throw new Error("no blob for " + e.integrity + " in the pristine cache: " + blob);

            console.log("resolved :", e.resolved);
            console.log("version  :", installed.version);
            console.log("integrity:", e.integrity);
            console.log("fetched into the empty cache:", blob, "(" + fs.statSync(blob).size + " bytes)");
          '
