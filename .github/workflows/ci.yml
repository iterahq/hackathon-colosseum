name: CI

# Scoped exception: this repo is in the `iterahq` GitHub org, which is NOT on the
# devfellowship-scoped dfl-runner fleet (org-scoped runners aren't available to
# other orgs -> jobs would queue forever). So CI runs on ubuntu-latest. Same
# rationale as the taigfs/* personal-repo carve-out (CLAUDE.md "🚦 CI green merge
# policy"). devfellowship/* repos stay on dfl-runner — this carve-out is iterahq-only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      # `npm run build` is `vite build`, which TRANSPILES without type-checking —
      # so a type error could reach main invisibly (that is exactly how two
      # latent TS2554s shipped in #191 before #193 caught them). This step is the
      # gate: it fails the build on any type error.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
