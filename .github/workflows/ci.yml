name: CI

# ──────────────────────────────────────────────────────────────────────────────
# RUNNER: self-hosted `dfl-runner` fleet — NOT ubuntu-latest (changed 2026-07-29)
#
# WHY: the `iterahq` org is on the GitHub FREE plan and exhausted its 2000
# included GitHub-hosted Actions minutes (2000/2000, no overage allowance). From
# that moment EVERY workflow run across the whole org failed in ~3 seconds with
# no runner assigned and zero steps executed — CI was not red, it was absent.
# Rather than enable paid Actions billing, iterahq now uses the two runner VPSes
# we already own.
#
# HOW: a GitHub runner registration belongs to exactly ONE scope, and free orgs
# cannot use enterprise-level shared runner groups — so the existing
# `devfellowship` registrations CANNOT be shared. We registered SEPARATE
# iterahq-scoped runner processes co-located on the same two hosts (2 per host,
# 4 total: `itera-runner-1/2` + `itera-runner-02-1/2`), carrying the same
# `self-hosted,dfl-runner` labels. Because labels are scoped per org, an iterahq
# job can only ever land on an iterahq-registered runner — there is no
# cross-org routing. Self-hosted minutes are free and unmetered.
#
# WHY IT IS SAFE HERE: `itera-player` is a PRIVATE repo
# (`gh api repos/iterahq/itera-player --jq .private` -> true), so the fork-PR RCE
# hazard that bans self-hosted runners on PUBLIC repos does not apply. The
# iterahq runner group keeps `allows_public=false`.
#
# NOTE: an earlier version of this header claimed org-scoped runners "aren't
# available to other orgs, so jobs would queue forever". That was true only of
# the devfellowship registrations; it was never a reason iterahq could not have
# runners of its own.
#
# Infra is versioned at devfellowship/dfl-infra:vps/dfl-runner/
# (docker-compose.iterahq*.yml, install-iterahq.sh, README "iterahq org runners").
# ──────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # See the runner rationale at the top of this file (iterahq free-plan
    # Actions-minutes exhaustion -> our own iterahq-scoped dfl-runners).
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      # `npm run build` is `vite build`, which TRANSPILES without type-checking —
      # so a type error could reach main invisibly (that is exactly how two
      # latent TS2554s shipped in #191 before #193 caught them). This step is the
      # gate: it fails the build on any type error.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # DOC DRIFT GATE (2026-07-31)
  #
  # `scripts/verify-docs.sh` shipped in this repo's foundation commit and NO
  # workflow ever called it — `grep -rn verify-docs .github/` returned nothing.
  # Meanwhile CLAUDE.md and repo-contract.yaml drifted far enough that agents
  # were being pointed at a deleted directory (`src/components/activity/`) and a
  # retired entrypoint (`src/pages/LessonPage.tsx`). The checker would have
  # caught both on day one. It is wired now, and it BLOCKS.
  #
  # It is blocking rather than advisory because, once its two false-positive
  # classes were fixed (qualified cross-repo paths, gitignored build output), a
  # full run over all four docs is CLEAN — so it costs nothing until something
  # actually drifts. An advisory gate is how it got ignored for a year.
  #
  # Separate job, and NO `npm install`: the checker is pure bash + git + node, so
  # it returns in seconds and does not eat into the `build-test` wall-clock
  # budget that the browser-mode promotion decision (see below) is measured
  # against. `setup-node` is still needed — step 4 of the checker asserts that
  # the tools named in the docs' setup commands actually exist, and the bare
  # self-hosted runner has no `npm` on PATH without it. (That check earned its
  # keep on the very first run by catching exactly this.)
  # ──────────────────────────────────────────────────────────────────────────
  docs-drift:
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify docs match the code
        run: bash scripts/verify-docs.sh

  # ──────────────────────────────────────────────────────────────────────────
  # ACTIVITY CHARACTERIZATION BASELINE — BLOQUEANTE (sub-plano 0 de
  # `20260731-itera-eventos-aprendizagem`, Q4 respondida "entra no gate de PR").
  #
  # POR QUE AQUI E NÃO NO `e2e.yml`
  #
  # O `e2e.yml` é `workflow_dispatch` + cron diário, roda contra prod ao vivo
  # (learn + api + app), e é capability-gated: dependência ausente vira SKIP. Ele
  # responde "prod está costurado?". Esta suíte responde uma pergunta diferente e
  # incompatível com aquele contrato: "o comportamento das atividades mudou neste
  # PR?". Ela precisa (a) travar merge, (b) rodar contra o CÓDIGO DO PR e não
  # contra o deploy, (c) nunca pular. Enfiá-la no `e2e.yml` herdaria as três
  # propriedades erradas — e arrastaria a suíte cara de prod pro gate junto.
  #
  # ZERO SEGREDOS — E ISSO É REQUISITO, NÃO CONVENIÊNCIA
  #
  # `iterahq/itera-player` tem exatamente DOIS Actions secrets (`CLOUDFLARE_*`) —
  # verificado 2026-07-31. `ITERA_SMOKE_*` e `VITE_SUPABASE_*` NÃO existem, que é
  # exatamente por que o `e2e.yml` vive vermelho/vazio. Um gate bloqueante que
  # depende de credencial não provisionada é um gate bloqueante sempre vermelho.
  # Por isso a suíte builda com uma origem Supabase STUB
  # (`http://stub.supabase.invalid`, TLD reservado, jamais resolve) e intercepta
  # tudo no Playwright. Ver `e2e/support/harnessStub.ts`.
  #
  # ORÇAMENTO (V3 do plano: < 10 min)
  #
  # Medido em 2026-07-31 na openclaw-tainan: 48 cenários, **45s** de ponta a
  # ponta INCLUINDO o `vite build`. O `timeout-minutes: 15` é folga pro runner
  # self-hosted, não expectativa. Se um dia passar de 10 min, CORTE cenário e
  # diga o que cortou — truncar em silêncio é pior que cobrir menos.
  #
  # Job separado do `build-test` de propósito: o custo do navegador fica isolado
  # no wall-clock, do mesmo jeito que o `browser-mode` (ver abaixo).
  # ──────────────────────────────────────────────────────────────────────────
  activity-baseline:
    runs-on: [self-hosted, dfl-runner]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ `node node_modules/playwright/cli.js`, NÃO `npx playwright`: o `npx`
      # resolve pelo cache dele e pode instalar uma revisão de Chromium DIFERENTE
      # da que o `@playwright/test` do lock exige — aí o teste roda com um browser
      # que não existe e falha com "Executable doesn't exist". Queimado 2026-07-31.
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      # O `webServer` da config faz o `vite build` + `vite preview` com a origem
      # Supabase stub. Nada de rede externa, nada de login, nada de DB.
      - name: Activity characterization baseline
        run: npm run e2e:baseline

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-baseline-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # BROWSER MODE (ADR-8) — NÃO-BLOQUEANTE POR UMA SEMANA (ADR-9).
  #
  # Plano `20260728-itera-activity-testing`. A Q2 foi respondida "A": o tier
  # novo entra reportando e NÃO travando merge, e só vira gate depois de uma
  # semana estável, se o delta couber no orçamento medido.
  #
  # `continue-on-error: true` é o que torna essa promessa verificável em vez de
  # declarada. NÃO REMOVER sem a decisão de promoção — e, quando ela vier, ela
  # tem que citar o número medido, não a intenção.
  #
  #   Observação começa em: 2026-07-28
  #   Revisão de promoção  : 2026-08-04
  #   Orçamento da Fase 0  : o `build-test` bloqueante não deve passar de ~4m30s.
  #     ⚠️ Aquele teto foi ancorado numa mediana de 3m01s que hoje está OBSOLETA
  #     (o `build-test` já roda ~3m40s desde que o typecheck virou gate e a
  #     suíte cresceu). A folga real é de ~50s, e é contra ESSE número que a
  #     promoção tem que ser decidida.
  #
  # ⚠️ LEIA ANTES DA REVISÃO DE 2026-08-04. Até 2026-08-03 este job NUNCA foi
  # verde — nem uma vez, nem na `main`. Ele saía `exit 1` com duas unhandled
  # rejections, com os 3 testes PASSANDO: o `vitest.browser.config.ts` não
  # carregava o plugin que vendoriza o Monaco, então `/vendor/monaco/vs/loader.js`
  # dava 404 e o `@monaco-editor/loader` rejeitava. Era falha de HARNESS, não de
  # produto, e o `continue-on-error` a manteve invisível por uma semana inteira.
  # Duas leituras para a decisão de promoção:
  #   1. A semana de observação NÃO produziu o dado que o ADR-9 pede — o que foi
  #      observado foi um job quebrado. O relógio de estabilidade recomeça agora.
  #   2. Um job não-bloqueante permanentemente vermelho é caro de outro jeito:
  #      ele deixa um context VERMELHO no `statusCheckRollup` de todo PR, o que
  #      trava o `safe-admin-merge` (que exige TODOS os contexts verdes).
  # A recomendação registrada na Fase 3 do plano segue de pé por um motivo
  # independente e não resolvido aqui: o custo dominante é o
  # `playwright install --with-deps chromium` (1–2 min) contra ~50s de folga.
  # Cachear `~/.cache/ms-playwright` e MEDIR antes de promover.
  #
  # Ele roda como JOB SEPARADO de propósito: assim o custo do navegador aparece
  # isolado no wall-clock, que é exatamente o dado que a decisão de promoção
  # precisa. Misturá-lo no `build-test` esconderia a única medida que importa.
  # ──────────────────────────────────────────────────────────────────────────
  browser-mode:
    # Mesmo runner do `build-test`: os dfl-runners próprios do iterahq (ver o
    # cabeçalho deste arquivo). O job é `continue-on-error: true`, então mesmo
    # que o `playwright install --with-deps` tropece no host self-hosted ele
    # não trava merge — o que preserva a promessa do ADR-9 durante a migração.
    runs-on: [self-hosted, dfl-runner]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Só o Chromium: as instâncias do projeto de browser declaram apenas ele.
      - name: Install Chromium for the Vitest browser provider
        run: npx playwright install --with-deps chromium

      # `npm run test:browser` usa `vitest.browser.config.ts`, que seleciona
      # SOMENTE as stories com a tag `browser-mode` (hoje: match e code).
      - name: Storybook browser-mode tests
        run: npm run test:browser
