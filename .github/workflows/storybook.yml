name: Storybook

# Publica o PREVIEW de cada PR no projeto Cloudflare Pages `itera-storybook`.
# A publicação da `main` (custom domain storybook.iterahq.dev) é do
# `deploy-storybook.yml` — este workflow tinha um segundo deploy de `main`, e os
# dois rodavam no mesmo commit com grupos de concorrência diferentes: dois
# uploads do mesmo projeto disputando quem escreve por último, em runner
# self-hosted que a iterahq paga em tempo de VPS.
#
# PR publica um PREVIEW no alias de branch `pr-<n>` do MESMO projeto Pages.
# Sem isso o designer só enxergava o ANTES: o único link que existia apontava
# para `main`, então "olha a proposta" abria a versão vigente — e no caso de
# story NOVA nem resolvia. O alias é determinístico
# (https://pr-<n>.itera-storybook.pages.dev), o que deixa o webhook do Discord
# compor o link do DEPOIS sem esperar o build terminar.
#
# Required repo secrets (already configured): CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_API_TOKEN (token must have Account > Cloudflare Pages: Edit).
#
# Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29). The `iterahq` org
# is on the GitHub free plan and burned through its 2000 included GitHub-hosted
# Actions minutes, after which every run org-wide failed in ~3s with no runner
# assigned. Instead of enabling paid billing, iterahq got its own org-scoped
# runner processes on the two dfl-runner VPSes we already own (registrations are
# per-org, so these are separate from the devfellowship ones; labels are
# identical: `self-hosted,dfl-runner`). Safe because this repo is PRIVATE — the
# fork-PR RCE hazard that bans self-hosted on public repos does not apply.
# Full rationale in ci.yml; infra in devfellowship/dfl-infra:vps/dfl-runner/.
on:
  pull_request:
    paths:
      - '.storybook/**'
      - 'src/**'
      - 'packages/**'
      - 'design-playground/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storybook.yml'

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: storybook-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    # See the runner note at the top of this file.
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history on purpose (changed from `fetch-depth: 1`) — the
          # Design Playground "send order" (`scripts/storybook-playground-order.ts`,
          # read by `scripts/storybook-playground-indexer.ts` at index time)
          # runs `git log --diff-filter=A -1` per `design-playground/**`
          # story file to find the commit that ADDED it, which needs the
          # file's full history reachable, not just a recent slice. The next
          # step still deepens `origin/<base>` separately for the PR diff
          # itself.
          fetch-depth: 0

      - name: Fetch the base branch for the diff
        # The checkout above is already full history (`fetch-depth: 0`); a
        # `--depth` fetch here would re-shallow the repo and collapse every
        # Design Playground send date onto the same grafted commit.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git merge-base "origin/${BASE_REF}" HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate "🆕 PR #N" stories inside Design Playground
        # Runs BEFORE the build on purpose — it writes CSF re-exports under
        # `.storybook/generated/`, which `.storybook/main.ts` already globs
        # in. See scripts/generate-nesta-pr-stories.ts.
        run: npx tsx scripts/generate-nesta-pr-stories.ts
        env:
          STORYBOOK_PR_NUMBER: ${{ github.event.pull_request.number }}
          STORYBOOK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy PR preview to Cloudflare Pages
        # `--branch=pr-<n>` em vez do nome real da branch: o alias entra no
        # hostname, então um nome com `/` ou acento viraria URL que o webhook
        # não consegue prever. O número da PR é estável e já é o que o Discord
        # tem em mãos.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=itera-storybook --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview link on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          preview="https://pr-${PR}.itera-storybook.pages.dev"
          # Ids reais só existem depois do build — storybook-pr-comment.ts lê
          # storybook-static/index.json e o manifesto do gerador (ambos já no
          # disco neste ponto) e imprime `{depoisUrl, changedSection}`. `{}`
          # (sem os dois campos) se o manifesto não existir por algum motivo —
          # o comentário ainda sai, só sem essa seção e com o "Depois"
          # apontando pra raiz do preview.
          pr_comment_json=$(npx tsx scripts/storybook-pr-comment.ts "$preview" || echo '{}')
          depois_url=$(echo "$pr_comment_json" | jq -r '.depoisUrl // empty')
          changed_section=$(echo "$pr_comment_json" | jq -r '.changedSection // empty')
          depois="${depois_url:-$preview}"
          body=$(printf '%s\n' \
            '<!-- storybook-preview -->' \
            '### 📖 Storybook desta PR' \
            '' \
            "| | |" \
            "|---|---|" \
            "| **Depois** (esta PR) | ${depois} |" \
            "| **Antes** (main) | https://storybook.iterahq.dev |" \
            '' \
            "${changed_section}")
          # Edita o comentário existente em vez de empilhar um por push.
          id=$(gh pr view "$PR" --json comments \
                 --jq '.comments[] | select(.body | startswith("<!-- storybook-preview -->")) | .url' \
               | tail -1 | sed 's|.*#issuecomment-||')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body"
          else
            gh pr comment "$PR" --body "$body"
          fi
