name: Storybook

# Builds the Storybook static site and deploys it to the existing Cloudflare
# Pages project `itera-storybook` (custom domain: storybook.iterahq.dev). The
# Pages project has NO git integration (direct/wrangler upload), so this
# workflow is the deploy mechanism on push to `main`. PRs build-only (no deploy)
# so storybook breakage is caught before merge without publishing a preview.
#
# Required repo secrets (already configured): CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_API_TOKEN (token must have Account > Cloudflare Pages: Edit).
#
# Runner: self-hosted `dfl-runner` fleet (changed 2026-07-29). The `iterahq` org
# is on the GitHub free plan and burned through its 2000 included GitHub-hosted
# Actions minutes, after which every run org-wide failed in ~3s with no runner
# assigned. Instead of enabling paid billing, iterahq got its own org-scoped
# runner processes on the two dfl-runner VPSes we already own (registrations are
# per-org, so these are separate from the devfellowship ones; labels are
# identical: `self-hosted,dfl-runner`). Safe because this repo is PRIVATE — the
# fork-PR RCE hazard that bans self-hosted on public repos does not apply.
# Full rationale in ci.yml; infra in devfellowship/dfl-infra:vps/dfl-runner/.
on:
  pull_request:
    paths:
      - '.storybook/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storybook.yml'
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    # See the runner note at the top of this file.
    runs-on: [self-hosted, dfl-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iterahq'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare Pages
        # Only publish from main; PRs build-only (gate, no publish).
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=itera-storybook --branch=main
