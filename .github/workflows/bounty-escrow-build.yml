# Builds the bounty escrow program (SBF) and keeps the binary as an artifact.
# Not a gate: nothing else in this repo runs on push. The build box has no room
# for the SBF toolchain, so the program is compiled here and deployed by hand.
name: bounty-escrow-build

on:
  workflow_dispatch:
  push:
    branches: [feat/bounty-escrow-program, feat/r2-escrow-program]
    paths:
      - programs/bounty-escrow/**
      - .github/workflows/bounty-escrow-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: programs/bounty-escrow
        run: |
          solana --version
          cargo build-sbf
          ls -la target/deploy
          sha256sum target/deploy/itera_bounty_escrow.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itera-bounty-escrow
          path: |
            programs/bounty-escrow/target/deploy/itera_bounty_escrow.so
            programs/bounty-escrow/Cargo.lock
          retention-days: 14
