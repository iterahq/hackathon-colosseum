project_id = "nyzcbnnbffsizshiolbh"

# Awards and mints for the signed-in learner. The gateway check is off because it
# can reject this project's asymmetric-key JWTs; the function itself validates the
# token with the auth server (`auth.getUser`) and answers 401 without a valid one.
[functions.passport]
verify_jwt = false

# Public metadata and artwork that wallets and explorers fetch without a session.
[functions.credential-meta]
verify_jwt = false

# Public verification of an asset read from chain.
[functions.credential-verify]
verify_jwt = false

# Purchase rail, companion and lives. Same rule as `passport`: the gateway check
# is off and each function validates the bearer token itself (`auth.getUser`).
[functions.purchase-intent]
verify_jwt = false

[functions.purchase-confirm]
verify_jwt = false

# Readable without a session; a valid token only adds `owned` / `equipped`.
[functions.shop-items]
verify_jwt = false

[functions.wallet-faucet]
verify_jwt = false

[functions.companion]
verify_jwt = false

[functions.lives]
verify_jwt = false
