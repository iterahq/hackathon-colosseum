project_id = "nyzcbnnbffsizshiolbh"

# Awards and mints for the signed-in learner. The gateway check is off because it
# can reject this project's asymmetric-key JWTs; the function itself validates the
# token with the auth server (`auth.getUser`) and answers 401 without a valid one.
[functions.passport]
verify_jwt = false

# Public metadata and artwork that wallets and explorers fetch without a session.
[functions.credential-meta]
verify_jwt = false

# Public verification of an asset read from chain.
[functions.credential-verify]
verify_jwt = false

# Purchase rail, companion and lives. Same rule as `passport`: the gateway check
# is off and each function validates the bearer token itself (`auth.getUser`).
[functions.purchase-intent]
verify_jwt = false

[functions.purchase-confirm]
verify_jwt = false

# Same settlement as `purchase-confirm`, for a wallet that only signs: the server broadcasts.
[functions.purchase-submit]
verify_jwt = false

# Readable without a session; a valid token only adds `owned` / `equipped`.
[functions.shop-items]
verify_jwt = false

[functions.wallet-faucet]
verify_jwt = false

[functions.companion]
verify_jwt = false

[functions.lives]
verify_jwt = false

# Public profile of a wallet: the Itera assets it holds, each checked on chain.
[functions.learner-profile]
verify_jwt = false

# The capability graph of a wallet as our tables hold it (no chain read): the fast first paint of /u/<wallet>.
[functions.capability-graph]
verify_jwt = false

# An e-mail account binds one Solana wallet by signing a challenge.
[functions.link-wallet]
verify_jwt = false

# Gift a life: a Solana Action (blink). Public by specification: wallets and blink
# clients call it with no session; the payment is verified on chain.
[functions.action-gift]
verify_jwt = false

# The recipient's unseen gifts ("someone gave you a life").
[functions.gifts]
verify_jwt = false

# Invite code, claim and status. Same rule as `passport`: the token is checked in code.
[functions.referral]
verify_jwt = false

# Takes an item the learner earned (level unlock) without payment. Token checked in code.
[functions.shop-claim]
verify_jwt = false

# Live-class podium medals: an instructor/owner of the session's tenant records the top three.
# The token and the caller's memberships are checked in code.
[functions.class-podium]
verify_jwt = false

# Teacher endorsement of a learner's certification, written on chain by the authority.
# The token and the caller's memberships (instructor/owner of the learner's tenant) are checked in code.
[functions.endorse]
verify_jwt = false

# Public counter of the Circuito (treasury -> mint authority transfers). Read only, no token.
[functions.circuit]
verify_jwt = false

# Phoenix Crystals: balance, spend, theme. Same rule as `passport`: the token is checked in code.
# `GET /crystals/token.json` and `/token.svg` are the public metadata of the token.
[functions.crystals]
verify_jwt = false

# Link previews for /c, /u and /gift: nginx hands crawlers to it by user agent. Public, read-only.
[functions.share-meta]
verify_jwt = false

# Bounties. The board is public; the blink that funds an escrow account is public by specification.
[functions.bounty-board]
verify_jwt = false

[functions.bounty-action]
verify_jwt = false

# Same rule as `passport`: the gateway check is off and the function validates the bearer token itself.
[functions.bounty-claim]
verify_jwt = false

# Sponsors: the token is checked in code, then the caller's staff memberships.
[functions.bounty-sponsor]
verify_jwt = false

# Any wallet posts and funds a bounty: public GET for the form's options; every POST checks the bearer token in code.
[functions.bounty-post]
verify_jwt = false

# Server-side grading: the only writer of a completion. Validates the bearer token itself.
[functions.grade]
verify_jwt = false
