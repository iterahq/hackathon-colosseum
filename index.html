<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Some wallet extensions (MetaMask + SES/LavaMoat lockdown) strip
      // crypto.randomUUID from the page, which crashes any code — ours or a
      // dependency — that relies on it. Restore it from getRandomValues before
      // the app bundle loads so the SPA still boots for those users.
      (function () {
        try {
          var c = window.crypto;
          if (c && typeof c.getRandomValues === 'function' && typeof c.randomUUID !== 'function') {
            c.randomUUID = function randomUUID() {
              var b = c.getRandomValues(new Uint8Array(16));
              b[6] = (b[6] & 0x0f) | 0x40;
              b[8] = (b[8] & 0x3f) | 0x80;
              var h = [];
              for (var i = 0; i < 16; i++) h.push((b[i] + 0x100).toString(16).slice(1));
              return (
                h[0] + h[1] + h[2] + h[3] + '-' + h[4] + h[5] + '-' + h[6] + h[7] +
                '-' + h[8] + h[9] + '-' + h[10] + h[11] + h[12] + h[13] + h[14] + h[15]
              );
            };
          }
        } catch (e) {
          /* crypto locked by SES — nothing more we can do */
        }
      })();
    </script>
    <title>Itera | Microlearning com IA</title>
    <meta name="description" content="Aprenda fazendo. Microatividades que elevam suas habilidades — do não-programador ao dev." />
    <meta name="author" content="Itera" />
    <meta name="theme-color" content="#0A0908" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <meta property="og:title" content="Itera | Microlearning com IA" />
    <meta property="og:description" content="Aprenda fazendo. Microatividades que elevam suas habilidades — do não-programador ao dev." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DevFellowship" />
    <!--
      Fontes da marca servidas do NOSSO domínio (`public/vendor/fonts/`), nunca
      de uma CDN pública: numa rede de escola que só libera o app + o Supabase,
      o <link> pro Google caía e TODA a tipografia degradava pro fallback do
      sistema. Mesma decisão do React UMD/Tailwind Play (ADR-12/ADR-14) e do
      Monaco (ADR-24). Regerar: `npm run vendor:fonts`.
      (Hostnames omitidos de propósito: um grep de auditoria por CDN externa no
      `dist/` deve dar zero — ver src/test/fontsSelfHost.test.ts.)

      Preload só das duas faces que SEMPRE renderizam no primeiro paint — Inter
      (corpo, arquivo variável) e Barlow Condensed 700 (h1–h6) — pra cortar o
      flash do `font-display: swap`. As demais ficam sob demanda via
      unicode-range/peso. `crossorigin` é obrigatório mesmo same-origin: fonte é
      buscada em modo CORS e sem ele o preload seria descartado e baixado 2x.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/vendor/fonts/inter-variable-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/vendor/fonts/barlow-condensed-700-latin.woff2" crossorigin>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  </head>

  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
