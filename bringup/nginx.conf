# =============================================================================
# The one origin supabase-js expects.
#
# `createClient(url, key)` derives every sub-URL from a SINGLE origin:
# `${url}/auth/v1/...` for GoTrue, `${url}/rest/v1/...` for PostgREST,
# `${url}/realtime/v1/...` for the websocket, `${url}/storage/v1/...` for files.
# The hosted product puts Kong in front of four services; this puts nginx in
# front of two, and answers honestly for the two that are not here.
#
# ⚠️ REALTIME AND STORAGE ANSWER 501, NOT 404.
# A 404 is indistinguishable from "wrong path" and would send the next reader
# hunting for a typo. 501 Not Implemented says the route is understood and the
# service was deliberately left out of this stack. A capture that needs live
# rooms or uploaded avatars must say so instead of silently photographing an
# empty state — which is the "confidently wrong map" failure again, one level
# down.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # A large body: the admin API creates users with JSON payloads and the
    # default 1m is plenty, but PostgREST bulk inserts during seeding are not.
    client_max_body_size 16m;

    # ---- GoTrue ------------------------------------------------------------
    location /auth/v1/ {
        # 🚨 THE PREFLIGHT, ANSWERED HERE — measured, not guessed.
        # GoTrue v2.177 replies 204 to an OPTIONS with NO
        # `Access-Control-Allow-Origin`, so the browser blocks the login POST
        # that follows and the app shows "Verifique suas credenciais" — a
        # CREDENTIALS message for a CORS failure. `curl` never sees it, because
        # curl sends no preflight. In the hosted product Kong answers this;
        # here nginx does. Real responses already carry `ACAO: *` from GoTrue
        # and PostgREST themselves, so only the preflight is synthesised and
        # nothing is duplicated.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     $http_access_control_request_headers always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length                   0;
            return 204;
        }

        proxy_pass http://auth:9999/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- PostgREST ---------------------------------------------------------
    # `Accept-Profile` / `Content-Profile` carry the schema name and must reach
    # PostgREST unaltered; nginx forwards unknown request headers by default, so
    # nothing is done here except not breaking them.
    location /rest/v1/ {
        # 🚨 THE PREFLIGHT, ANSWERED HERE — measured, not guessed.
        # GoTrue v2.177 replies 204 to an OPTIONS with NO
        # `Access-Control-Allow-Origin`, so the browser blocks the login POST
        # that follows and the app shows "Verifique suas credenciais" — a
        # CREDENTIALS message for a CORS failure. `curl` never sees it, because
        # curl sends no preflight. In the hosted product Kong answers this;
        # here nginx does. Real responses already carry `ACAO: *` from GoTrue
        # and PostgREST themselves, so only the preflight is synthesised and
        # nothing is duplicated.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     $http_access_control_request_headers always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length                   0;
            return 204;
        }

        proxy_pass http://rest:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- deliberately absent ----------------------------------------------
    location /realtime/v1/ {
        return 501 '{"message":"realtime is not part of the bring-up stack"}';
        add_header Content-Type application/json always;
    }

    location /storage/v1/ {
        return 501 '{"message":"storage is not part of the bring-up stack"}';
        add_header Content-Type application/json always;
    }

    location = / {
        return 200 '{"stack":"itera-bringup","services":["auth","rest"]}';
        add_header Content-Type application/json always;
    }
}
