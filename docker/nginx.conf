server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Security headers (HSTS, nosniff, referrer, CSP incl. frame-ancestors for learn.devfellowship.com) live in one
  # snippet. nginx drops inherited add_header lines in any location that sets its own, so the snippet is included
  # again in every such location. MUST NOT send X-Frame-Options (would block the iframe).
  include /etc/nginx/snippets/itera-headers.conf;
  # The bundle went out uncompressed (1.5 MB of JS on a phone). The proxy in front does not compress,
  # so nginx does; text/html is always included. gzip_proxied: the request arrives through a proxy.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
  location / {
    try_files $uri $uri/ /index.html;
  }
  # The shell is never kept: a new deploy must reach every tab on its next navigation (the hashed assets are).
  location = /index.html {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  # Link previews: a crawler (by user agent) opening a public credential, profile or gift page gets a small HTML
  # page with the Open Graph tags of that page from the share-meta edge function; every browser gets the SPA as before.
  # The SPA cannot serve per-page meta tags itself, and these three pages are what people paste into a chat.
  location ~ ^/(c|u|gift)/ {
    if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|TelegramBot|Googlebot|bingbot|Applebot|redditbot|Pinterest|Embedly|iframely|vkShare)") {
      rewrite ^ /__share$uri last;
    }
    try_files $uri /index.html;
  }
  # A dead URL answers 404 (judge N21). The app's own routes answer 200 with the shell; any other path gets
  # the same shell with status 404, so a crawler and a network tab see the truth while Tera's page renders.
  location ~ ^/(login|signup|try|verify|catalog|course|program|lesson|artifacts|profile|passport|shop|world|bounties|subscribe|live|g|admin|author|prototipo|auth|dev)(/|$) {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }
  location ~ ^/[^./]+(/[^.]*)?$ {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /index.html;
    try_files $uri $uri/ =404;
  }
  location ^~ /__share/ {
    internal;
    proxy_pass https://nyzcbnnbffsizshiolbh.supabase.co/functions/v1/share-meta/;
    proxy_ssl_server_name on;
    proxy_set_header Host nyzcbnnbffsizshiolbh.supabase.co;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_read_timeout 10s;
  }
  # Vite names every file in /assets/ after its content, so a year and immutable. A name that is gone
  # (a tab older than the last deploy) is a 404, not index.html. No "always" on Cache-Control: a 404 must not be kept.
  location /assets/ {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # The shell reads this file at every launch: a changed value must reach it at once. A missing file is a 404, not index.html.
  location = /shell-config.json {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Solana Actions: blink clients on other origins fetch this file to map /gift/<wallet> to the action URL,
  # so it must answer with open CORS. A missing file is a 404, not index.html.
  location = /actions.json {
    include /etc/nginx/snippets/itera-headers.conf;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Content-Encoding, Accept-Encoding" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # R-5: the files an OS fetches to verify universal links / App Links. Exact paths, 200 with JSON, never the
  # SPA fallback and never a redirect (both OSes refuse a redirect). The iOS file has no extension, so nginx
  # would type it octet-stream: default_type says JSON. Not compressed. A missing file is a 404.
  location = /.well-known/apple-app-site-association {
    include /etc/nginx/snippets/itera-headers.conf;
    default_type application/json;
    gzip off;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/itera-headers.conf;
    default_type application/json;
    gzip off;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Lesson images and clips: static and unhashed, and re-cut now and then, so a day and not immutable.
  # Without this they had no cache header at all and a phone asked for them again on every visit. A
  # missing file is a 404, not index.html (an <img> fed HTML never finishes loading).
  location /lesson-media/ {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  # What /verify publishes about the escrow program (source, IDL, binary): real files, compared byte for byte by the
  # page. "^~" keeps them out of the app-route regex above, which would answer index.html. A missing file is a 404.
  location = /verify/ {
    return 301 /verify;
  }
  location ^~ /verify/ {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "public, max-age=300";
    types {
      application/json json;
      text/plain rs;
      application/octet-stream so;
    }
    try_files $uri =404;
  }
  # Feedback clips: static and unhashed, so a week and not immutable. No "always" on Cache-Control: a 404 must not be kept for a week.
  location /vendor/sfx/ {
    include /etc/nginx/snippets/itera-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
